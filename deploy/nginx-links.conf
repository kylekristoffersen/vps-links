# Goes inside the HTTPS (listen 443) server block of
# /etc/nginx/sites-available/veit-tools, installed as a copy in
# /etc/nginx/snippets/vps-links.conf and included there.
# Admin login only: the same password file as the Crossbuilder and the RSS
# filter, and the same realm name as the Crossbuilder, so the browser asks
# once per visit for both pages on this address.

location = /links {
    return 301 /links/;
}

location /links/ {
    auth_basic           "Kyle's tools";
    auth_basic_user_file /etc/nginx/.admin-tools-htpasswd;
    # Serves only site/ from the clone, never .git or deploy/.
    alias /opt/vps-links/site/;
    index index.html;
}
