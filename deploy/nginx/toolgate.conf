# In-page login for Kyle's tools. Included in each tools server block
# (/etc/nginx/snippets/toolgate.conf). The server block itself then says
# which login it needs, e.g. "auth_request /_gate/check/team;", and
# locations can ask for more ("auth_request /_gate/check/admin;").
# The login service (toolgate) listens on 127.0.0.1:8600.

# nginx asks these before serving a page. Not reachable from outside.
location = /_gate/check/admin {
    internal;
    auth_request off;
    proxy_pass http://127.0.0.1:8600;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Real-IP $remote_addr;
}
location = /_gate/check/team {
    internal;
    auth_request off;
    proxy_pass http://127.0.0.1:8600;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Real-IP $remote_addr;
}

# The sign-in page, sign-out and the "not available" page.
location /_gate/ {
    auth_request off;
    proxy_pass http://127.0.0.1:8600;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 16k;
}

# Not signed in: send the browser to the sign-in page, remembering the address.
error_page 401 = @gate_login;
location @gate_login {
    auth_request off;
    rewrite ^ /_gate/start break;
    proxy_pass http://127.0.0.1:8600;
    proxy_set_header X-Original-URL "$scheme://$host$request_uri";
}

# Signed in, but this login may not open the page.
error_page 403 = @gate_denied;
location @gate_denied {
    auth_request off;
    rewrite ^ /_gate/denied break;
    proxy_pass http://127.0.0.1:8600;
    proxy_set_header Cookie $http_cookie;
}
