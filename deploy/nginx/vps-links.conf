# Kyle's link page and the single-page tools beside it (site/ in this repo).
# Goes inside the tools server block via /etc/nginx/snippets/vps-links.conf.
# Admin login only (toolgate).

location = /links {
    return 301 /links/;
}

location /links/ {
    auth_request /_gate/check/admin;
    # Serves only site/ from the clone, never .git, gate/ or deploy/.
    alias /opt/vps-links/site/;
    index index.html;
    add_header Cache-Control "no-cache";
}

# Trello -> Todoist page (trello-sync/app.py on 127.0.0.1:8620). Admin only.
location = /trello-sync {
    return 301 /trello-sync/;
}

location /trello-sync/ {
    auth_request /_gate/check/admin;
    proxy_pass http://127.0.0.1:8620;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
    client_max_body_size 2m;
}
