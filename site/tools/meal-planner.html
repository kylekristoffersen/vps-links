<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Prep Planner</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1, h2, h3 {
            color: #2c3e50;
        }
        .blocks-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .randomizer-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .randomizer-container button {
            margin: 0 5px 10px 5px;
        }
        .meal-section, .shopping-list {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
            background-color: #f9f9f9;
            margin-bottom: 20px;
        }
        select {
            width: 100%;
            margin-bottom: 5px;
        }
        .button-group {
            margin-top: 10px;
        }
        .button-group button {
            margin-right: 10px;
        }
        input[type="number"] {
            width: 40px;
            text-align: center;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #2980b9;
        }
        .file-upload {
            margin-bottom: 20px;
        }
        #ingredientsList {
            width: 100%;
        }
        .ingredients-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        .ingredients-table th {
            background-color: #f2f2f2;
            padding: 8px;
            text-align: left;
            border: 1px solid #ddd;
        }
        .ingredients-table td {
            padding: 8px;
            border: 1px solid #ddd;
        }
        .ingredients-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .block2-row {
            background-color: #e8f4f8 !important;
        }
        .placeholder-message {
            column-count: 1;
            margin-bottom: 15px;
        }
        .instructions {
            background-color: #e8f4f8;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .meal-block {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .meal-block h3 {
            margin-bottom: 10px;
        }
        .loading {
            display: none;
            color: #3498db;
            margin-left: 10px;
        }
        .progress-container {
            width: 100%;
            height: 20px;
            background-color: #f3f3f3;
            border-radius: 5px;
            margin-top: 10px;
            display: none;
        }
        .progress-bar {
            height: 100%;
            background-color: #3498db;
            border-radius: 5px;
            width: 0%;
            transition: width 0.3s;
        }
        select, input {
            padding: 8px;
            margin: 5px 0;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        .meal-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .meal-select {
            flex: 1;
            margin-right: 15px;
        }
        .meal-select select {
            width: 100%;
        }
        .portion-control {
            display: flex;
            align-items: center;
            white-space: nowrap;
        }
        .portion-control label {
            margin-right: 10px;
            font-size: 0.9em;
            color: #555;
        }
        .number-control {
            display: flex;
            align-items: center;
        }
        .number-control button {
            width: 30px;
            height: 30px;
            padding: 0;
            margin: 0 5px;
            font-size: 18px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Remove arrows from number inputs */
        .no-arrows::-webkit-inner-spin-button, 
        .no-arrows::-webkit-outer-spin-button { 
            -webkit-appearance: none;
            margin: 0;
        }
        .no-arrows {
            -moz-appearance: textfield; /* Firefox */
        }
        @media (max-width: 768px) {
            .blocks-container {
                grid-template-columns: 1fr;
            }
            .meal-row {
                flex-direction: column;
                align-items: flex-start;
            }
            .meal-select {
                width: 100%;
                margin-right: 0;
                margin-bottom: 10px;
            }
            .portion-control {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <h1>Meal Prep Planner</h1>
    
    <div class="file-upload">
        <h2>Upload Your Meal Plan</h2>
        <input type="file" id="fileInput" accept=".xlsx,.xls">
        <button onclick="processFile()">Load Meal Plan</button>
        <span id="loading" class="loading">Loading...</span>
        <div id="progressContainer" class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
    </div>
    
    <div class="blocks-container">
        <div class="meal-selections" id="block1-container">
            <!-- Block 1 will be generated here -->
        </div>
        
        <div class="meal-selections" id="block2-container">
            <!-- Block 2 will be generated here -->
        </div>
    </div>
    
    <div class="randomizer-container">
        <button onclick="randomizeMeals()">Randomize All Meals</button>
        <button onclick="randomizeBlock('block1')">Randomize Block 1</button>
        <button onclick="randomizeBlock('block2')">Randomize Block 2</button>
        <button onclick="resetPlanner()">Reset Planner</button>
    </div>
    
    <div class="shopping-list">
        <h2>Shopping List</h2>
        <div id="ingredientsList">
            <p class="placeholder-message">Select your meals to see ingredients here.</p>
        </div>
        <div class="button-group">
            <button onclick="copyShoppingList()">Copy to Clipboard</button>
        </div>
    </div>
    
    <script>
        // Store all meal data
        let mealData = {
            breakfasts: [],
            lunches: [],
            dinners: [],
            snacks: []
        };
        
        // Store the selected meals for two 3-day blocks
        let selectedMeals = {
            block1: { breakfast: "", lunch: "", dinner: "", snack1: "", snack2: "" },
            block2: { breakfast: "", lunch: "", dinner: "", snack1: "", snack2: "" }
        };

        // List of baked goods to mark with BLOCK 2
        const bakedGoodsList = [
            "Kornobageta",
            "Chléb",
            "Kaiserka cereální",
            "Bulka slunečnicová",
            "Zrnochléb",
            "Bagetka grahamová"
        ];
        
        // List of items to exclude from BLOCK 2 marking
        const excludedFromBlock2 = [
            "chlebicky",
            "chlebíčky"
        ];
        
        // Function to check if an ingredient is a baked good from the list
        function isBakedGood(ingredientName) {
            return bakedGoodsList.some(item => 
                ingredientName.toLowerCase().includes(item.toLowerCase())
            );
        }
        
        // Function to check if an ingredient should be excluded from BLOCK 2 marking
        function isExcludedFromBlock2(ingredientName) {
            return excludedFromBlock2.some(item => 
                ingredientName.toLowerCase().includes(item.toLowerCase())
            );
        }
        
        // Check if an ingredient name contains "BLOCK 2"
        function isBlock2Item(ingredientName) {
            return ingredientName.includes("BLOCK 2");
        }
        
        // Randomize all meals
        function randomizeMeals() {
            randomizeBlock('block1');
            randomizeBlock('block2');
        }
        
        // Randomize meals for a specific block
        function randomizeBlock(blockId) {
            const mealTypes = ['breakfast', 'lunch', 'dinner', 'snack1', 'snack2'];
            
            mealTypes.forEach(type => {
                // Get the select element
                const selectElement = document.getElementById(`${blockId}-${type}`);
                if (!selectElement) return;
                
                // Get all non-empty options (skip the first "Select a..." option)
                const options = Array.from(selectElement.options).slice(1);
                if (options.length === 0) return;
                
                // Select a random option
                const randomIndex = Math.floor(Math.random() * options.length);
                selectElement.selectedIndex = randomIndex + 1; // +1 because we skipped the first option
                
                // Update selected meal
                updateSelectedMeal(blockId, type, options[randomIndex].value);
            });
            
            // Shopping list is automatically updated by updateSelectedMeal
        }
        
        // Copy shopping list to clipboard
        function copyShoppingList() {
            // First, get the shopping list
            const ingredientsList = document.getElementById('ingredientsList');
            const table = ingredientsList.querySelector('.ingredients-table');
            
            if (!table) {
                alert('Please generate a shopping list first.');
                return;
            }
            
            // Create clipboard content with meal plan first, but no headers
            let clipboardText = "";
            
            // Define tab spacing - We need an extra tab for the meal plan to align properly
            const mealPlanTabSpacing = "\t\t\t"; // Three tabs for meal plan
            const ingredientsTabSpacing = "\t\t"; // Two tabs for ingredients list
            
            // Get all meal types
            const mealTypes = ['breakfast', 'lunch', 'dinner', 'snack1', 'snack2'];
            const mealTypeLabels = {
                'breakfast': 'Breakfast',
                'lunch': 'Lunch',
                'dinner': 'Dinner',
                'snack1': 'Snack 1',
                'snack2': 'Snack 2'
            };
            
            // Add each meal type row with meals from both blocks with proper spacing
            mealTypes.forEach(type => {
                const block1Meal = selectedMeals.block1[type] || "None";
                const block2Meal = selectedMeals.block2[type] || "None";
                
                // Get portion counts
                const block1Count = getPersonCount('block1', type);
                const block2Count = getPersonCount('block2', type);
                
                // Format with spacing that properly aligns Block 2 meals
                clipboardText += `${mealTypeLabels[type]}: ${block1Meal} (${block1Count})${mealPlanTabSpacing}${mealTypeLabels[type]}: ${block2Meal} (${block2Count})\n`;
            });
            
            // Add a separator before the shopping list (just a blank line)
            clipboardText += "\n";
            
            // Now add the shopping list in table format (tab-separated) with column separation
            let regularItems = [];
            let block2Items = [];
            
            // Extract data from the table
            const rows = table.querySelectorAll('tbody tr');
            rows.forEach(row => {
                const columns = row.querySelectorAll('td');
                const ingredient = columns[0].textContent.trim();
                const amount = columns[1].textContent.trim();
                
                // Check if it's a BLOCK 2 item
                if (isBlock2Item(ingredient)) {
                    // Remove "BLOCK 2" from the name
                    const cleanIngredient = ingredient.replace(" BLOCK 2", "");
                    block2Items.push(`${cleanIngredient}\t${amount}`);
                } else {
                    regularItems.push(`${ingredient}\t${amount}`);
                }
            });
            
            // Find the max number of rows needed
            const maxRows = Math.max(regularItems.length, block2Items.length);
            
            for (let i = 0; i < maxRows; i++) {
                // Add regular item or empty cells for columns A/B
                if (i < regularItems.length) {
                    clipboardText += regularItems[i];
                } else {
                    clipboardText += "\t";  // Empty A/B columns
                }
                
                // Use the ingredients tab spacing for the shopping list
                clipboardText += ingredientsTabSpacing;
                
                // Add BLOCK 2 item or empty D/E columns
                if (i < block2Items.length) {
                    clipboardText += block2Items[i];
                }
                
                // Add new line (except for the last row)
                if (i < maxRows - 1) {
                    clipboardText += "\n";
                }
            }
            
            // Copy to clipboard
            navigator.clipboard.writeText(clipboardText)
                .then(() => {
                    alert('Meal plan and shopping list copied to clipboard!');
                })
                .catch(err => {
                    console.error('Could not copy text: ', err);
                    alert('Failed to copy to clipboard. Please try again.');
                });
        }
        
        // Process the uploaded file
        function processFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select a file first.');
                return;
            }
            
            // Show loading indicator
            document.getElementById('loading').style.display = 'inline';
            document.getElementById('progressContainer').style.display = 'block';
            document.getElementById('progressBar').style.width = '0%';
            
            const reader = new FileReader();
            reader.onload = function(e) {
                // Update progress
                document.getElementById('progressBar').style.width = '30%';
                
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { 
                        type: 'array',
                        cellStyles: true
                    });
                    
                    // Process the workbook
                    processWorkbook(workbook);
                    
                    // Update progress
                    document.getElementById('progressBar').style.width = '100%';
                    
                    // Hide loading after a delay to show completion
                    setTimeout(() => {
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('progressContainer').style.display = 'none';
                    }, 1000);
                } catch (error) {
                    console.error("Error processing workbook:", error);
                    alert('Error processing the file: ' + error.message);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('progressContainer').style.display = 'none';
                }
            };
            reader.readAsArrayBuffer(file);
        }
        
        // Process the workbook
        function processWorkbook(workbook) {
            // Reset data
            mealData = {
                breakfasts: [],
                lunches: [],
                dinners: [],
                snacks: []
            };
            
            // Define category mapping
            const categoryMap = {
                "Breakfast": "breakfasts",
                "Lunch": "lunches",
                "Dinner": "dinners",
                "Snacks": "snacks"
            };
            
            // Process each core sheet
            for (const sheetName in categoryMap) {
                const categoryKey = categoryMap[sheetName];
                
                // Check if the sheet exists (case-sensitive)
                if (!workbook.SheetNames.includes(sheetName)) {
                    console.warn(`Sheet ${sheetName} not found in workbook`);
                    continue;
                }
                
                const worksheet = workbook.Sheets[sheetName];
                const meals = extractMeals(worksheet);
                
                // Add meals to the appropriate category
                mealData[categoryKey] = meals;
            }
            
            // Generate the meal selection interface
            generateMealSelections();
        }
        
        // Extract meals from a worksheet
        function extractMeals(worksheet) {
            const meals = [];
            let currentMeal = null;
            let ingredients = [];
            
            // Convert to array form for easier processing
            const data = XLSX.utils.sheet_to_json(worksheet, {header: 1});
            
            for (let i = 0; i < data.length; i++) {
                const row = data[i];
                
                // Skip rows with no data
                if (!row || row.length === 0 || !row[0]) {
                    if (currentMeal && ingredients.length > 0) {
                        // End of a meal - save it
                        meals.push({
                            name: currentMeal,
                            ingredients: [...ingredients]
                        });
                        currentMeal = null;
                        ingredients = [];
                    }
                    continue;
                }
                
                const firstCell = row[0];
                const secondCell = row[1];
                
                // Skip header row
                if (i === 0 && (firstCell === " " || firstCell === null || secondCell === "TOTAL")) {
                    continue;
                }
                
                // If first cell has content but second cell is empty
                // This is likely a meal name
                if (firstCell && (secondCell === undefined || secondCell === null || secondCell === "")) {
                    if (currentMeal && ingredients.length > 0) {
                        // Save previous meal
                        meals.push({
                            name: currentMeal,
                            ingredients: [...ingredients]
                        });
                    }
                    
                    // Start new meal
                    currentMeal = firstCell;
                    ingredients = [];
                } 
                // If we're in a meal and have values in first and second cells, it's an ingredient
                else if (currentMeal && firstCell && secondCell !== undefined && secondCell !== null && secondCell !== "") {
                    ingredients.push({
                        name: firstCell,
                        amount: secondCell
                    });
                }
            }
            
            // Add the last meal if there is one
            if (currentMeal && ingredients.length > 0) {
                meals.push({
                    name: currentMeal,
                    ingredients: [...ingredients]
                });
            }
            
            return meals;
        }
        
        // Generate the meal selection dropdowns
        function generateMealSelections() {
            const blocks = [
                { id: 'block1', name: 'First Block', containerId: 'block1-container' },
                { id: 'block2', name: 'Second Block', containerId: 'block2-container' }
            ];
            
            const mealTypes = [
                {key: 'breakfast', source: 'breakfasts', label: 'Breakfast'}, 
                {key: 'lunch', source: 'lunches', label: 'Lunch'}, 
                {key: 'dinner', source: 'dinners', label: 'Dinner'}, 
                {key: 'snack1', source: 'snacks', label: 'Snack 1'},
                {key: 'snack2', source: 'snacks', label: 'Snack 2'}
            ];
            
            // Check if we have meals
            let hasMeals = false;
            for (const type of mealTypes) {
                if (mealData[type.source] && mealData[type.source].length > 0) {
                    hasMeals = true;
                    break;
                }
            }
            
            if (!hasMeals) {
                const html = '<p>No meals found in the uploaded file. Please check that your Excel file has the correct format.</p>';
                document.getElementById('block1-container').innerHTML = html;
                document.getElementById('block2-container').innerHTML = '';
                return;
            }
            
            blocks.forEach(block => {
                let html = `<h2>${block.name}</h2>`;
                
                mealTypes.forEach(type => {
                    // Check if the array exists before trying to map it
                    const mealsArray = mealData[type.source] || [];
                    
                    // Filter out meals with empty names or names that look like headers
                    const validMeals = mealsArray.filter(meal => 
                        meal.name && 
                        typeof meal.name === 'string' && 
                        meal.name.trim() !== "" && 
                        meal.name !== " " &&
                        !meal.name.includes("TOTAL")
                    );
                    
                    // Sort meals alphabetically
                    validMeals.sort((a, b) => a.name.localeCompare(b.name));
                    
                    const options = validMeals.map(meal => 
                        `<option value="${meal.name}">${meal.name}</option>`
                    ).join('');
                    
                    // Set default person count based on meal type
                    let defaultPersonCount = 6;
                    if (type.key === 'snack1' || type.key === 'snack2') {
                        defaultPersonCount = 3;
                    }
                    
                    html += `
                        <div class="meal-item">
                            <div class="meal-row">
                                <div class="meal-select">
                                    <label for="${block.id}-${type.key}">${type.label}:</label>
                                    <select id="${block.id}-${type.key}" onchange="updateSelectedMeal('${block.id}', '${type.key}', this.value)">
                                        <option value="">Select a ${type.label.toLowerCase()}</option>
                                        ${options}
                                    </select>
                                </div>
                                <div class="portion-control">
                                    <label for="${block.id}-${type.key}-count">Servings:</label>
                                    <div class="number-control">
                                        <button onclick="decreaseCount('${block.id}', '${type.key}')">-</button>
                                        <input type="number" id="${block.id}-${type.key}-count" min="1" value="${defaultPersonCount}" onchange="updatePortionCount('${block.id}', '${type.key}')" class="no-arrows">
                                        <button onclick="increaseCount('${block.id}', '${type.key}')">+</button>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                });
                
                document.getElementById(block.containerId).innerHTML = html;
            });
        }
        
        // Update the selected meal and regenerate shopping list
        function updateSelectedMeal(block, type, value) {
            selectedMeals[block][type] = value;
            generateShoppingList(); // Automatically update shopping list
        }
        
        // Update portion count and regenerate shopping list
        function updatePortionCount(block, mealType) {
            generateShoppingList(); // Automatically update shopping list
        }
        
        // Get person count for specific meal in specific block
        function getPersonCount(block, mealType) {
            const countElement = document.getElementById(`${block}-${mealType}-count`);
            if (!countElement) return 1; // Default to 1 if element not found
            
            const count = parseInt(countElement.value);
            return isNaN(count) || count < 1 ? 1 : count;
        }
        
        // Find a meal by name in any category
        function findMeal(mealName) {
            const categories = ['breakfasts', 'lunches', 'dinners', 'snacks'];
            for (const category of categories) {
                const meal = (mealData[category] || []).find(m => m.name === mealName);
                if (meal) return meal;
            }
            return null;
        }
        
        // Scale amount by person count
        function scaleAmount(amount, personCount) {
            if (!amount || personCount <= 1) return amount;
            
            // Try to extract number and unit
            const match = String(amount).match(/^(\d+(?:\.\d+)?)(.*)$/);
            
            if (match) {
                const [_, numStr, unit] = match;
                const num = parseFloat(numStr);
                
                if (!isNaN(num)) {
                    // Scale the number by person count
                    return (num * personCount) + unit;
                }
            }
            
            // Return original if we can't scale
            return amount;
        }
        
        // Generate the shopping list from selected meals
        function generateShoppingList() {
            // Collect all ingredients from selected meals
            const allIngredients = {};
            const blocks = ['block1', 'block2'];
            
            blocks.forEach(block => {
                const daysPerBlock = 1;
                
                Object.keys(selectedMeals[block]).forEach(mealType => {
                    const mealName = selectedMeals[block][mealType];
                    if (!mealName) return;
                    
                    // Find the meal
                    const meal = findMeal(mealName);
                    
                    if (meal && meal.ingredients) {
                        // Get person count for this specific meal in this specific block
                        const personCount = getPersonCount(block, mealType);
                        
                        meal.ingredients.forEach(ingredient => {
                            let key = ingredient.name.trim();
                            
                            if (!key) return; // Skip empty ingredients
                            
                            // Add BLOCK 2 marker to baked goods in block 2
                            // But exclude items that should not have this marker
                            if (block === 'block2' && isBakedGood(key) && !isExcludedFromBlock2(key)) {
                                key = key + " BLOCK 2";
                            }
                            
                            if (!allIngredients[key]) {
                                // Create new ingredient entry with amounts adjusted for person count
                                const adjustedAmounts = Array(daysPerBlock).fill().map(() => {
                                    // Try to scale the amount by person count if possible
                                    return scaleAmount(ingredient.amount, personCount);
                                });
                                
                                allIngredients[key] = {
                                    amounts: adjustedAmounts,
                                    count: daysPerBlock
                                };
                            } else {
                                // Add this ingredient's amount for each day in the block, adjusted for person count
                                for (let i = 0; i < daysPerBlock; i++) {
                                    allIngredients[key].amounts.push(scaleAmount(ingredient.amount, personCount));
                                }
                                allIngredients[key].count += daysPerBlock;
                            }
                        });
                    }
                });
            });
            
            // Sort ingredients alphabetically within their groups (regular and BLOCK 2)
            const regularIngredients = [];
            const block2Ingredients = [];
            
            Object.keys(allIngredients).forEach(ingredient => {
                if (isBlock2Item(ingredient)) {
                    block2Ingredients.push(ingredient);
                } else {
                    regularIngredients.push(ingredient);
                }
            });
            
            regularIngredients.sort();
            block2Ingredients.sort();
            
            // Combine them with BLOCK 2 items at the end
            const sortedIngredients = [...regularIngredients, ...block2Ingredients];
            
            if (sortedIngredients.length === 0) {
                document.getElementById('ingredientsList').innerHTML = 
                    '<p class="placeholder-message">No ingredients found. Please select some meals first.</p>';
                return;
            }
            
            // Generate HTML for the shopping list as a table
            let html = `
                <table class="ingredients-table">
                    <thead>
                        <tr>
                            <th>Ingredient</th>
                            <th>Amount</th>
                        </tr>
                    </thead>
                    <tbody>`;
            
            sortedIngredients.forEach(ingredient => {
                const data = allIngredients[ingredient];
                
                // Filter out empty amounts
                const validAmounts = data.amounts.filter(amount => amount !== null && amount !== undefined && amount !== '');
                
                let amountText = '';
                if (validAmounts.length > 0) {
                    // Calculate total amounts by actually multiplying the numbers
                    const totalsByUnit = {};
                    
                    validAmounts.forEach(amount => {
                        // Extract the number and unit
                        const match = String(amount).match(/^(\d+(?:\.\d+)?)(.*)$/);
                        
                        if (match) {
                            const [_, numStr, unit] = match;
                            const num = parseFloat(numStr);
                            
                            if (!isNaN(num)) {
                                if (!totalsByUnit[unit]) {
                                    totalsByUnit[unit] = 0;
                                }
                                totalsByUnit[unit] += num;
                            } else {
                                // If not a number, just count occurrences
                                if (!totalsByUnit[amount]) {
                                    totalsByUnit[amount] = 0;
                                }
                                totalsByUnit[amount] += 1;
                            }
                        } else {
                            // Handle non-numeric amounts (just count them)
                            if (!totalsByUnit[amount]) {
                                totalsByUnit[amount] = 0;
                            }
                            totalsByUnit[amount] += 1;
                        }
                    });
                    
                    // Format the totals
                    amountText = Object.entries(totalsByUnit)
                        .map(([unit, total]) => {
                            // If it's a pure number (empty unit), format with no decimals
                            if (unit === '') {
                                return Math.round(total);
                            }
                            // If it's a standard unit, format the number and add the unit
                            else if (unit.match(/^[a-zA-Z%]+$/)) {
                                return `${Math.round(total)}${unit}`;
                            }
                            // For other values, show the count
                            else if (typeof total === 'number' && total > 1) {
                                return `${unit} × ${total}`;
                            }
                            else {
                                return unit;
                            }
                        })
                        .join(', ');
                }
                
                // Apply a special class for BLOCK 2 items for visual distinction
                const rowClass = isBlock2Item(ingredient) ? 'block2-row' : '';
                
                html += `
                    <tr class="${rowClass}">
                        <td>${ingredient}</td>
                        <td>${amountText}</td>
                    </tr>`;
            });
            
            html += `
                    </tbody>
                </table>`;
            
            document.getElementById('ingredientsList').innerHTML = html;
        }
        
        // Reset the planner
        function resetPlanner() {
            // Clear all selected meals
            const blocks = ['block1', 'block2'];
            const mealTypes = ['breakfast', 'lunch', 'dinner', 'snack1', 'snack2'];
            
            blocks.forEach(block => {
                mealTypes.forEach(type => {
                    // Reset selection to default (first option)
                    const selectElement = document.getElementById(`${block}-${type}`);
                    if (selectElement) {
                        selectElement.selectedIndex = 0;
                        selectedMeals[block][type] = "";
                    }
                    
                    // Reset serving counts to default values
                    const countElement = document.getElementById(`${block}-${type}-count`);
                    if (countElement) {
                        // Default is 6 for main meals, 3 for snacks
                        if (type === 'snack1' || type === 'snack2') {
                            countElement.value = 3;
                        } else {
                            countElement.value = 6;
                        }
                    }
                });
            });
            
            // Clear the shopping list
            document.getElementById('ingredientsList').innerHTML = 
                '<p class="placeholder-message">Select your meals to see ingredients here.</p>';
                
            // Clear the selectedMeals object
            selectedMeals = {
                block1: { breakfast: "", lunch: "", dinner: "", snack1: "", snack2: "" },
                block2: { breakfast: "", lunch: "", dinner: "", snack1: "", snack2: "" }
            };
        }
        
        // Increase count
        function increaseCount(block, mealType) {
            const countElement = document.getElementById(`${block}-${mealType}-count`);
            if (countElement) {
                let count = parseInt(countElement.value);
                if (isNaN(count)) count = 1;
                countElement.value = count + 1;
                updatePortionCount(block, mealType);
            }
        }
        
        // Decrease count
        function decreaseCount(block, mealType) {
            const countElement = document.getElementById(`${block}-${mealType}-count`);
            if (countElement) {
                let count = parseInt(countElement.value);
                if (isNaN(count) || count <= 1) count = 2; // Ensure we don't go below 1
                countElement.value = count - 1;
                updatePortionCount(block, mealType);
            }
        }
    </script>
