function sortableTitle(title){
  return (title || '').replace(/^the\s+/i, '');
}

function compareMovies(a, b, sortKey){
  switch(sortKey){
    case 'votes': return (b.vote_count || 0) - (a.vote_count || 0);
    case 'rating': return (b.vote_average || 0) - (a.vote_average || 0);
    case 'date': return (b.release_date || '').localeCompare(a.release_date || '');
    case 'alpha': return sortableTitle(a.title).localeCompare(sortableTitle(b.title));
    default: return 0;
  }
}

function sortLabel(sortKey){
  return {
    votes: 'by votes',
    rating: 'by rating',
    date: 'by release date',
    alpha: 'alphabetically'
  }[sortKey] || 'to original order';
}

function skipAllDisplayed(){
  const items = [...loadedMovies]; // snapshot — loadedMovies gets cleared in bulk below
  if(items.length === 0){
    alert('Nothing currently displayed to skip.');
    return;
  }
  const confirmed = confirm(`This will mark all ${items.length} title${items.length===1?'':'s'} currently displayed as SKIP (not interested). This can't be undone in bulk — you'd have to remove them individually from the Ignored list afterward. Continue?`);
  if(!confirmed) return;

  items.forEach(m => tagMovie(m, 'ignore', { silent: true }));
  loadedMovies = [];
  saveTags(); // one save + one drawer render for the whole batch, not per item

  grid.innerHTML = '<div class="empty-state">All displayed titles skipped. Click Show more or Go to load fresh results.</div>';
  clearSelection();
  statusLine.textContent = `Skipped ${items.length} title${items.length===1?'':'s'}.`;
}

document.getElementById('skipAllBtn').addEventListener('click', skipAllDisplayed);

function applyCurrentSort(){
  if(mode === 'watchlist'){
    renderWatchlist();
  } else if(loadedMovies.length > 0){
    reRenderLoaded();
  }
}

sortOrderSelect.addEventListener('change', applyCurrentSort);
document.getElementById('resortBtn').addEventListener('click', applyCurrentSort);

function reRenderLoaded(){
  loadedMovies = loadedMovies.filter(item => !tags[keyFor(item)]);
  const list = [...loadedMovies];
  if(sortOrderSelect.value){
    list.sort((a,b) => compareMovies(a, b, sortOrderSelect.value));
  }
  grid.innerHTML = '';
  clearSelection();
  renderCards(list);
  statusLine.textContent = `${list.length} titles loaded, re-sorted ${sortLabel(sortOrderSelect.value)}.`;
}
yearMinInput.addEventListener('change', resetAndFetch);
yearMaxInput.addEventListener('change', resetAndFetch);

let fetchGeneration = 0;

function resetAndFetch(){
  fetchGeneration++;
  // abandon queued lookups for cards about to be wiped
  detailFetchQueue.length = 0;
  resetCheckProgress();
  const myGeneration = fetchGeneration;
  nextPage = 1;
  totalPages = 1;
  autoPartitionWindowEnd = null;
  renderedIds = new Set();
  loadedMovies = [];
  grid.innerHTML = '';
  clearSelection();
  loadMoreBtn.style.display = 'none';
  lastFetchParams = currentFetchParams();
  if(mode === 'watchlist'){
    renderWatchlist();
  } else {
    loadMore(myGeneration);
  }
}

// Self-heals stale watchlist entries. A title's data (poster, runtime) is
// snapshotted at the moment you tag it — for very new titles TMDb sometimes
// hasn't uploaded a poster or finalized runtime yet at that exact moment,
// and items tagged before the SHORT/SERIES badges existed simply never had
// runtime captured at all. Rather than staying permanently blank, re-check
// TMDb for any entry missing either field and patch it in — to both the
// visible card and the cached tag, so it's fixed for good.
async function refreshMissingWatchlistData(items){
  const key = apiKeyInput.value.trim();
  if(!key) return;
  const missing = items.filter(item =>
    !item.poster_path || (item.mediaType !== 'tv' && typeof item.runtime !== 'number') ||
    item.original_language === undefined || (item.mediaType === 'tv' && !Array.isArray(item.genre_ids))
  );
  for(const item of missing){
    const mediaType = item.mediaType || 'movie';
    const detail = await tmdbFetch(`/${mediaType}/${item.id}`);
    if(!detail) continue;

    const tagKey = `${mediaType}-${item.id}`;
    const patch = {};
    if(detail.poster_path) patch.poster_path = detail.poster_path;
    if(mediaType !== 'tv' && typeof detail.runtime === 'number') patch.runtime = detail.runtime;
    if(detail.original_language !== undefined) patch.original_language = detail.original_language;
    if(mediaType === 'tv' && Array.isArray(detail.genres)) patch.genre_ids = detail.genres.map(g => g.id);
    if(tags[tagKey] && Object.keys(patch).length){ tags[tagKey] = { ...tags[tagKey], ...patch }; dirtyKeys.add(tagKey); }

    const cardEl = grid.querySelector(`.card[data-id="${item.id}"][data-media-type="${mediaType}"]`);
    if(patch.genre_ids && patch.genre_ids.includes(REALITY_TV_GENRE_ID)){
      cardEl?.remove(); // an older watchlist entry that predates this exclusion — silently drop it now that we know
      continue;
    }
    if(cardEl){
      if(detail.poster_path){
        const posterWrap = cardEl.querySelector('.poster-wrap');
        const noPosterEl = posterWrap?.querySelector('.no-poster');
        if(noPosterEl){
          const img = document.createElement('img');
          img.src = `${IMG_BASE}${detail.poster_path}`;
          img.alt = item.title;
          img.loading = 'lazy';
          noPosterEl.replaceWith(img);
        }
      }
      if(mediaType !== 'tv' && isShortRuntime(detail.runtime)){
        cardEl.classList.add('short-title');
        const posterWrap = cardEl.querySelector('.poster-wrap');
        if(posterWrap && !posterWrap.querySelector('.type-badge')){
          const badge = document.createElement('div');
          badge.className = 'type-badge short-badge';
          badge.textContent = 'SHORT';
          posterWrap.appendChild(badge);
        }
      }
    }
  }
  if(missing.some(item => tags[`${item.mediaType || 'movie'}-${item.id}`])){
    saveTagsWithReconcile(); // merges with current storage instead of blindly overwriting it
  }
}

function renderWatchlist(keepPagination){
  if(!keepPagination) listVisibleCount = LIST_PAGE_SIZE;
  grid.innerHTML = '';
  clearSelection();
  // Seen/Ignored entries deliberately never store poster/rating/runtime/
  // language (see tagMovie) since the drawer only ever showed them as plain
  // text — so those filters have nothing to work with here and are skipped
  // for those two categories rather than silently hiding everything.
  const hasFullData = listCategory === 'watchlist' || listCategory === 'notify';
  const ratingR = ratingRange();
  const votesR = votesRange();
  const hasRatingFilter = hasFullData && (ratingR.min !== null || ratingR.max !== null);
  const hasVotesFilter = hasFullData && (votesR.min !== null || votesR.max !== null);
  const showMovies = document.getElementById('filterMovies').checked;
  const showSeries = document.getElementById('filterSeries').checked;
  const showShorts = document.getElementById('filterShorts').checked;
  const showUnreleased = document.getElementById('filterUnreleased').checked;
  const searchTerm = document.getElementById('listSearchInput').value.trim().toLowerCase();
  const excludeMatches = document.getElementById('listSearchExclude').checked;

  let items = Object.keys(tags)
    .filter(key => tags[key].status === listCategory)
    .map(key => ({
      id: tags[key].id,
      mediaType: tags[key].mediaType || 'movie',
      title: tags[key].title,
      poster_path: tags[key].poster_path || null,
      vote_average: tags[key].vote_average,
      vote_count: tags[key].vote_count,
      runtime: tags[key].runtime,
      original_language: tags[key].original_language,
      genre_ids: tags[key].genre_ids,
      release_date: tags[key].year ? `${tags[key].year}-01-01` : ''
    }));

  if(hasFullData) items = items.filter(m => !isRealityTv(m));

  items = items.filter(m =>
    (!hasRatingFilter || inRange(m.vote_average || 0, ratingR)) &&
    (!hasVotesFilter || inRange(m.vote_count || 0, votesR)) &&
    passesYearFilter(m.release_date) &&
    (!hasFullData || (isAllowedLanguage(m) && matchesLanguageSelection(m)))
  );

  items = items.filter(m => showUnreleased || isReleased(m));

  items = items.filter(m => matchesGenreSelection(m));

  if(hasFullData){
    items = items.filter(m => {
      // Category defaults to "movie" until runtime is known to be short —
      // matches "movies are the default" from the badge behavior itself.
      const category = m.mediaType === 'tv' ? 'series' : (isShortRuntime(m.runtime) ? 'short' : 'movie');
      if(category === 'series') return showSeries;
      if(category === 'short') return showShorts;
      return showMovies;
    });
  }

  if(searchTerm){
    items = items.filter(m => {
      const matches = (m.title || '').toLowerCase().includes(searchTerm);
      return excludeMatches ? !matches : matches;
    });
  }

  items = items.sort((a,b) => sortOrderSelect.value
    ? compareMovies(a, b, sortOrderSelect.value)
    : sortableTitle(a.title).localeCompare(sortableTitle(b.title)));

  const totalCount = Object.values(tags).filter(t => t.status === listCategory).length;
  const categoryLabels = { watchlist: 'watchlist', seen: 'seen list', notify: 'notify list', ignore: 'ignored list' };

  const visibleItems = items.slice(0, listVisibleCount);
  const remaining = items.length - visibleItems.length;

  buildAzIndex(visibleItems);

  const listShowMoreBtn = document.getElementById('listShowMoreBtn');
  if(visibleItems.length === 0){
    grid.innerHTML = totalCount === 0
      ? `<div class="empty-state">Nothing in your ${categoryLabels[listCategory]} yet.</div>`
      : `<div class="empty-state">Nothing matches the current filters.</div>`;
    statusLine.textContent = '';
    listShowMoreBtn.style.display = 'none';
  } else {
    renderCards(visibleItems);
    statusLine.textContent = remaining > 0
      ? `${visibleItems.length} of ${items.length} title${items.length===1?'':'s'} in ${categoryLabels[listCategory]}.`
      : `${items.length} title${items.length===1?'':'s'} in ${categoryLabels[listCategory]}.`;
    if(hasFullData) refreshMissingWatchlistData(visibleItems);

    if(remaining > 0){
      listShowMoreBtn.textContent = `Show ${Math.min(remaining, LIST_PAGE_SIZE)} more (${remaining} left)`;
      listShowMoreBtn.style.display = 'block';
    } else {
      listShowMoreBtn.style.display = 'none';
    }
  }
}

function buildAzIndex(items){
  const azContainer = document.getElementById('azIndex');
  if(!azContainer) return;
  if(items.length < 10){ azContainer.innerHTML = ''; return; } // not worth an index for a short list
  const lettersPresent = new Set();
  items.forEach(m => {
    const t = sortableTitle(m.title || '').trim();
    const first = t.charAt(0).toUpperCase();
    lettersPresent.add(/[A-Z]/.test(first) ? first : '#');
  });
  const allLetters = ['#', ...Array.from({length:26}, (_, i) => String.fromCharCode(65+i))];
  azContainer.innerHTML = allLetters.map(l => {
    const has = lettersPresent.has(l);
    return `<button class="az-letter${has ? '' : ' az-empty'}" data-letter="${l}">${l}</button>`;
  }).join('');
  azContainer.querySelectorAll('.az-letter:not(.az-empty)').forEach(btn => {
    btn.addEventListener('click', () => {
      const letter = btn.dataset.letter;
      const cards = [...grid.querySelectorAll('.card')];
      const target = cards.find(c => {
        const titleEl = c.querySelector('.card-title');
        if(!titleEl) return false;
        const t = sortableTitle(titleEl.textContent || '').trim();
        const first = t.charAt(0).toUpperCase();
        return letter === '#' ? !/[A-Z]/.test(first) : first === letter;
      });
      if(target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

async function tmdbFetch(path, params={}, retryCount=0){
  const key = apiKeyInput.value.trim();
  if(!key){
    statusLine.textContent = 'Paste your TMDb API key above first.';
    statusLine.style.color = 'var(--remove)';
    return null;
  }
  const url = new URL(API_BASE + path);
  url.searchParams.set('api_key', key);
  for(const k in params) url.searchParams.set(k, params[k]);
  const res = await fetch(url);
  if(res.status === 429 && retryCount < 3){
    // Rate limited — back off and retry instead of failing outright. Uses
    // TMDb's own Retry-After header when present, otherwise a short
    // exponential backoff (0.5s, 1s, 2s).
    const retryAfter = parseFloat(res.headers && res.headers.get && res.headers.get('Retry-After')) || (0.5 * Math.pow(2, retryCount));
    await new Promise(r => setTimeout(r, retryAfter * 1000));
    return tmdbFetch(path, params, retryCount + 1);
  }
  if(!res.ok){
    statusLine.textContent = res.status === 401 ? 'TMDb error 401. Check your API key.' : `TMDb error ${res.status}.`;
    statusLine.style.color = 'var(--remove)';
    return null;
  }
  statusLine.style.color = 'var(--text-faint)';
  return res.json();
}

function passesYearFilter(releaseDate){
  const r = yearRange();
  if(r.min === null && r.max === null) return true;
  const year = parseInt((releaseDate || '').slice(0,4), 10);
  if(!year) return true; // don't hide titles with unknown release dates
  return inRange(year, r);
}

const todayISO = new Date().toISOString().slice(0, 10);

// Baked-in, always-on: exclude anything not yet released (planned, in
// production, or dated in the future). Unlike passesYearFilter, a missing
// date does NOT pass here — the point is confirming something is actually
// out, not grouping by era, so "unknown" defaults to excluded.
function isReleased(item){
  if(!item.release_date) return false;
  return item.release_date <= todayISO;
}

function isShortRuntime(runtime){
  return typeof runtime === 'number' && runtime > 0 && runtime < 60;
}

// Three-way categorization for the browse-section Unreleased/Shorts/Regular
// toggles. Runtime isn't available in browse results (only the individual
// title page has it), so a movie with unknown runtime can't be definitively
// placed into Short vs Regular yet — it's allowed through as long as EITHER
// of those two toggles is on, and gets reclassified (possibly removed) once
// the lazy per-card check resolves its real runtime.
function passesBrowseTypeFilter(m){
  const showUnreleased = document.getElementById('browseShowUnreleased').checked;
  const showShorts = document.getElementById('browseShowShorts').checked;
  const showRegular = document.getElementById('browseShowRegular').checked;
  if(!isReleased(m)) return showUnreleased;
  if(m.mediaType === 'tv') return showRegular; // TV has no "short" concept in this tool
  if(typeof m.runtime === 'number') return isShortRuntime(m.runtime) ? showShorts : showRegular;
  return showShorts || showRegular; // unknown yet — don't prematurely exclude either possibility
}

// Baked-in, always-on across every section: only these five languages are
// eligible. Discover enforces this server-side via with_original_language
// (efficient — TMDb never returns anything else). Trending and Search have
// no server-side language filter at all, but original_language is already
// present on every result they return, so filtering client-side there costs
// nothing extra. A missing value (only possible for not-yet-self-healed
// older Watchlist entries) passes rather than being hidden prematurely.
const ALLOWED_LANGUAGES = ['en', 'ja', 'ko', 'cs', 'sk'];
// Baked-in, silent, always-on: TMDb's TV genre ID for Reality is 10764.
// Discover excludes it server-side (efficient — TMDb never returns it).
// Trending/Search have no server-side genre exclusion, but genre_ids is
// already included on every TV result they return, so this costs nothing
// extra there either.
const REALITY_TV_GENRE_ID = 10764;
function isRealityTv(item){
  return item.mediaType === 'tv' && Array.isArray(item.genre_ids) && item.genre_ids.includes(REALITY_TV_GENRE_ID);
}

function isAllowedLanguage(item){
  return !item.original_language || ALLOWED_LANGUAGES.includes(item.original_language);
}

// User-controlled narrowing on top of the baked-in eligibility list. When
// "All eligible languages" is selected, this is a no-op (same 5 languages
// already covered by isAllowedLanguage). Discover enforces the specific
// pick server-side too, but this client-side check makes the selector work
// identically in Trending, Search, and Watchlist as well, which have no
// server-side language param to use — original_language is already present
// on every result those return, so this costs nothing extra.
function matchesLanguageSelection(item){
  const selected = languageSelect.value;
  if(!selected || selected === 'en|ja|ko|cs|sk') return true;
  return !item.original_language || item.original_language === selected;
}

// Movies and TV have genuinely different genre taxonomies (movies split
// Action/Adventure, TV combines them as "Action & Adventure"; TV also has
// genres with no movie equivalent like Soap/Talk, and vice versa). The genre
// picker is shared across every section now (Trending/Discover/Search/Lists
// can all mix or switch between movie and TV), so rather than showing one
// type's raw IDs and silently breaking whenever the other type is in view,
// it's built from a combined-by-name list: each entry remembers whichever
// numeric id(s) that name maps to per type, and filtering always looks up
// the id that matches the ITEM's own mediaType, not whichever type happens
// to be toggled at the moment.
let combinedGenreList = []; // [{name, movieId?, tvId?}, ...]

function ensureGenreCache(type){
  if(genreCache[type].length) return Promise.resolve(genreCache[type]);
  return tmdbFetch(`/genre/${type}/list`).then(data => {
    if(data && Array.isArray(data.genres)) genreCache[type] = data.genres;
    rebuildCombinedGenreList();
    return genreCache[type];
  });
}

// Kept for the Discover fetch path, which still needs "has this type's
// genre list arrived yet" resolved before building with_genres.
async function loadGenres(){
  await ensureGenreCache(contentType);
}

function rebuildCombinedGenreList(){
  const map = new Map();
  (genreCache.movie || []).forEach(g => {
    const entry = map.get(g.name) || { name: g.name };
    entry.movieId = g.id;
    map.set(g.name, entry);
  });
  (genreCache.tv || []).forEach(g => {
    const entry = map.get(g.name) || { name: g.name };
    entry.tvId = g.id;
    map.set(g.name, entry);
  });
  combinedGenreList = [...map.values()].sort((a, b) => a.name.localeCompare(b.name));
  populateGenreSelects(combinedGenreList);
  backfillGenreBadges();
}

function populateGenreSelects(list){
  // Preserve whatever was already picked across a repopulation (this can
  // fire twice — once when movie genres arrive, once when TV genres do).
  const prev1 = genreSelect.value;
  const prev2 = genreSelect2.value;
  genreSelect.innerHTML = '<option value="">Any genre</option>' +
    list.map(g => `<option value="${escapeHtml(g.name)}">${escapeHtml(g.name)}</option>`).join('');
  genreSelect2.innerHTML = '<option value="">+ second genre</option>' +
    list.map(g => `<option value="${escapeHtml(g.name)}">${escapeHtml(g.name)}</option>`).join('');
  if(prev1) genreSelect.value = prev1;
  if(prev2) genreSelect2.value = prev2;
}

// First-listed genre for a card badge — purely cosmetic, so it uses
// whichever genre cache is already loaded rather than blocking on network.
function firstGenreName(item){
  const type = item.mediaType === 'tv' ? 'tv' : 'movie';
  const list = genreCache[type];
  if(!Array.isArray(item.genre_ids) || !item.genre_ids.length || !list || !list.length) return null;
  const match = list.find(g => g.id === item.genre_ids[0]);
  return match ? match.name : null;
}

// Cards can render before both genre caches have arrived (badge fetch is
// fire-and-forget so it never blocks the first paint). Once a cache lands,
// fill in any badge left blank the first time around.
function backfillGenreBadges(){
  grid.querySelectorAll('.card').forEach(card => {
    const el = card.querySelector('.genre-badge');
    if(!el || el.textContent) return;
    let ids = [];
    try { ids = JSON.parse(card.dataset.genreIds || '[]'); } catch(e) {}
    if(!ids.length) return;
    const list = genreCache[card.dataset.mediaType === 'tv' ? 'tv' : 'movie'];
    if(!list || !list.length) return;
    const match = list.find(g => g.id === ids[0]);
    if(match) el.textContent = match.name;
  });
}

// User-picked genre narrowing, shared by Trending/Search/Lists (Discover
// applies its picks server-side via with_genres already). AND logic across
// both dropdowns, matching Discover's comma-AND semantics. A genre name
// with no id for this item's own mediaType (e.g. a TV-only genre while
// looking at a movie) can never match that item, so it's correctly
// excluded rather than silently ignored. Missing genre_ids (not yet
// self-healed older Watchlist/Notify entries) passes through rather than
// being hidden.
function matchesGenreSelection(item){
  const selectedNames = [genreSelect.value, genreSelect2.value].filter(Boolean);
  if(!selectedNames.length) return true;
  if(!Array.isArray(item.genre_ids)) return true;
  const isTv = item.mediaType === 'tv';
  return selectedNames.every(name => {
    const entry = combinedGenreList.find(g => g.name === name);
    const id = entry ? (isTv ? entry.tvId : entry.movieId) : undefined;
    return id !== undefined && item.genre_ids.includes(id);
  });
}

// TMDb caps every query at page 500 (~10,000 results), but that ceiling is
// PER EXACT QUERY, not global. "Movies from 2019" and "movies from 2018"
// are different queries, each with its own fresh 10,000-result allowance.
// So Discover splits into single-year windows and shifts to the next one
// whenever the current year's ceiling is hit, letting a deep scan push
// arbitrarily far into TMDb's catalog instead of stopping at ~10k total —
// and single-year granularity means even an unusually prolific year is
// very unlikely to itself exceed 10k results, unlike a wider multi-year
// window would. Only applies to Discover — Trending/Search have no
// server-side year filter to partition by at all.
const AUTO_PARTITION_WINDOW_SIZE = 1;
const AUTO_PARTITION_FLOOR_YEAR = 1900;
let autoPartitionWindowEnd = null; // upper bound (year) of the current window; null = not started this session

function currentPartitionBounds(){
  const currentYear = new Date().getFullYear();
  const yr = yearRange();

  const ceilingYear = yr.max !== null ? Math.min(yr.max, currentYear) : currentYear;
  const floorYear = Math.max(AUTO_PARTITION_FLOOR_YEAR, yr.min !== null ? yr.min : AUTO_PARTITION_FLOOR_YEAR);

  if(autoPartitionWindowEnd === null) autoPartitionWindowEnd = ceilingYear;
  const windowEnd = Math.min(autoPartitionWindowEnd, ceilingYear);
  const windowStart = Math.max(floorYear, windowEnd - AUTO_PARTITION_WINDOW_SIZE + 1);
  return { windowStart, windowEnd, floorYear, exhausted: windowEnd < floorYear };
}

function shiftToNextPartitionWindow(){
  const { windowStart } = currentPartitionBounds();
  autoPartitionWindowEnd = windowStart - 1;
}

async function fetchPage(page){
  if(mode === 'trending'){
    return tmdbFetch(`/trending/${contentType}/week`, { page });
  } else if(mode === 'search'){
    const q = searchInput.value.trim();
    if(!q) return null;
    return tmdbFetch(`/search/${contentType}`, { query: q, page });
  } else {
    await loadGenres();
    const selectedGenreNames = [genreSelect.value, genreSelect2.value].filter(Boolean);
    const isTv = contentType === 'tv';
    // A selected name with no id for the CURRENT type (e.g. a TV-only genre
    // while browsing movies) is dropped rather than sent as an invalid
    // param — Discover just won't narrow by that one, matching how
    // matchesGenreSelection treats it for Trending/Search (see there).
    const genreIds = selectedGenreNames
      .map(name => {
        const entry = combinedGenreList.find(g => g.name === name);
        return entry ? (isTv ? entry.tvId : entry.movieId) : undefined;
      })
      .filter(id => id !== undefined);
    const uniqueGenreIds = [...new Set(genreIds)];
    const params = {
      page,
      sort_by: 'popularity.desc',
      with_genres: uniqueGenreIds.join(','), // comma = AND, so a second genre stacks onto the first
      with_original_language: languageSelect.value
    };
    if(contentType === 'tv') params.without_genres = String(REALITY_TV_GENRE_ID);
    const rr = ratingRange();
    if(rr.min !== null && rr.min > 0) params['vote_average.gte'] = rr.min;
    if(rr.max !== null) params['vote_average.lte'] = rr.max;
    const vr = votesRange();
    if(vr.min !== null && vr.min > 0) params['vote_count.gte'] = vr.min;
    if(vr.max !== null) params['vote_count.lte'] = vr.max;
    const { windowStart, windowEnd, exhausted } = currentPartitionBounds();
    if(!exhausted){
      const dateField = contentType === 'movie' ? 'primary_release_date' : 'first_air_date';
      params[`${dateField}.gte`] = `${windowStart}-01-01`;
      params[`${dateField}.lte`] = `${windowEnd}-12-31`;
    }
    return tmdbFetch(`/discover/${contentType}`, params);
  }
}

// Keeps fetching consecutive TMDb pages (capped per click) until we have a
// decent batch of genuinely new, untagged titles — TMDb pages overlap and
// shrink as titles get filtered, so a single page fetch isn't reliable.
async function loadMore(generation){
  if(generation === undefined) generation = fetchGeneration; // e.g. Show More button, not a fresh reset
  if(isLoading) return;
  if(mode === 'search' && !searchInput.value.trim()){
    statusLine.textContent = 'Type something to search for.';
    return;
  }
  isLoading = true;
  loadMoreBtn.disabled = true;
  goBtn.disabled = true;
  loadMoreBtn.style.display = 'none';
  stopRequested = false;
  stopBtn.disabled = false;
  stopBtn.textContent = 'Stop';
  stopBtn.style.display = 'block';

  // Snapshot the type this whole batch belongs to — if the user flips the
  // Movies/TV toggle mid-fetch, results already in flight must keep the
  // type they were actually requested under, not whatever is selected by
  // the time they land. Without this, an in-flight movie fetch resolving
  // after a toggle to TV would get mislabeled as a TV result, and since
  // movie/TV IDs collide (e.g. movie 272 = Batman Begins, tv 272 = a
  // different show), that title would render under the wrong entry.
  const myType = contentType;

  const TARGET_NEW = Math.max(1, parseInt(document.getElementById('batchSize').value, 10) || 40);
  let batch = [];
  let totalHiddenThisRound = 0;
  let pagesFetched = 0;
  let stoppedByUser = false;

  while(batch.length < TARGET_NEW){
    if(generation !== fetchGeneration){ isLoading = false; stopBtn.style.display = 'none'; return; } // superseded — bail out silently
    if(stopRequested){ stoppedByUser = true; break; }

    if(nextPage > totalPages){
      // This window's pages are exhausted (or it's not a windowed mode at
      // all). For Discover, try shifting to the next unexplored year range
      // before giving up — that's what actually gets around TMDb's 500-page
      // ceiling, which applies per exact query rather than globally.
      if(mode === 'discover' && !currentPartitionBounds().exhausted){
        shiftToNextPartitionWindow();
        nextPage = 1;
        totalPages = 1;
        if(currentPartitionBounds().exhausted) break; // that shift went past the historical floor — genuinely done
      } else {
        break;
      }
    }

    const windowLabel = mode === 'discover' ? (() => { const b = currentPartitionBounds(); return b.windowStart === b.windowEnd ? ` [${b.windowEnd}]` : ` [${b.windowStart}-${b.windowEnd}]`; })() : '';
    statusLine.textContent = `Loading page ${nextPage}${totalPages > 1 ? ` of ${totalPages}` : ''}${windowLabel} (found ${batch.length} of ${TARGET_NEW} so far)...`;
    const data = await fetchPage(nextPage);
    if(generation !== fetchGeneration){ isLoading = false; stopBtn.style.display = 'none'; return; } // check again — state may have changed during the await
    if(stopRequested){ stoppedByUser = true; if(!data) break; } // stop was clicked while this page was in flight — finish processing it, then stop
    pagesFetched++;
    if(!data){
      // This window's query was rejected (e.g., TMDb's page-500 ceiling) —
      // try shifting to the next window rather than stopping outright.
      if(mode === 'discover' && !currentPartitionBounds().exhausted){
        shiftToNextPartitionWindow();
        nextPage = 1;
        totalPages = 1;
        continue;
      }
      break;
    }
    totalPages = data.total_pages || 1;

    data.results.forEach(r => {
      r.title = r.title || r.name;
      r.release_date = r.release_date || r.first_air_date;
      r.mediaType = myType;
    });

    const ratingR = ratingRange();
    const hasRatingFilter = ratingR.min !== null || ratingR.max !== null;
    const votesR = votesRange();
    const hasVotesFilter = votesR.min !== null || votesR.max !== null;
    const fresh = data.results.filter(m =>
      !tags[keyFor(m)] &&
      !renderedIds.has(keyFor(m)) &&
      (!hasRatingFilter || inRange(m.vote_average || 0, ratingR)) &&
      (!hasVotesFilter || inRange(m.vote_count || 0, votesR)) &&
      passesYearFilter(m.release_date) &&
      isAllowedLanguage(m) &&
      matchesLanguageSelection(m) &&
      passesBrowseTypeFilter(m) &&
      !isRealityTv(m) &&
      (mode === 'discover' || matchesGenreSelection(m)) // Discover already filtered server-side
    );
    const hidden = data.results.length - fresh.length;
    totalHiddenThisRound += hidden;

    fresh.forEach(m => renderedIds.add(keyFor(m)));
    batch.push(...fresh);

    nextPage++;
    if(stoppedByUser) break;
  }

  if(generation !== fetchGeneration){ isLoading = false; stopBtn.style.display = 'none'; return; }

  stopBtn.style.display = 'none';

  if(sortOrderSelect.value){
    batch.sort((a,b) => compareMovies(a, b, sortOrderSelect.value));
  }
  loadedMovies.push(...batch);
  renderCards(batch);
  const newlyShown = batch.length;

  isLoading = false;
  loadMoreBtn.disabled = false;
  goBtn.disabled = false;

  if(stoppedByUser){
    statusLine.textContent = `Stopped — ${newlyShown} new shown before stopping (${pagesFetched} page${pagesFetched===1?'':'s'} checked, ${totalHiddenThisRound} filtered out).`;
  } else if(newlyShown === 0 && grid.children.length === 0){
    if(mode === 'discover' && currentPartitionBounds().exhausted){
      statusLine.textContent = `Reached ${AUTO_PARTITION_FLOOR_YEAR} — scanned every year window down to the historical floor for this exact filter combination and found nothing left to show.`;
    } else {
      statusLine.textContent = renderedIds.size === 0 && totalHiddenThisRound === 0
        ? ''
        : 'Nothing left to show here — everything on these pages is filtered out by your rating, votes, or year settings.';
    }
  } else {
    statusLine.textContent = `${newlyShown} new shown this round (${pagesFetched} page${pagesFetched===1?'':'s'} checked, ${totalHiddenThisRound} filtered out).`;
  }

  const morePagesInWindow = nextPage <= totalPages;
  const moreWindowsLeft = mode === 'discover' && !currentPartitionBounds().exhausted;
  if(morePagesInWindow || moreWindowsLeft){
    loadMoreBtn.style.display = 'block';
  }
}

loadMoreBtn.addEventListener('click', async () => {
  await loadMore();
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
});

stopBtn.addEventListener('click', () => {
  stopRequested = true;
  stopBtn.disabled = true;
  stopBtn.textContent = 'Stopping...';
});

// Caps how many lazy detail-fetches run at once. Without this, scrolling
// through a large batch — especially one heavy in short films, where every
// card needs its own runtime lookup — could fire dozens of requests
// simultaneously, overwhelming the browser's connection pool or tripping
// TMDb's rate limiting. Extra requests queue up and run as earlier ones
// finish instead of all firing at once.
const MAX_CONCURRENT_DETAIL_FETCHES = 4;

// Progress of the runtime/release (Shorts / Unreleased) check, cumulative
// since the last reset: how many cards queued, how many resolved, and how
// many of those were then removed by the type toggles.
const checkProgress = { total: 0, done: 0, removed: 0 };
let checkGeneration = 0; // bumped on reset so lookups still in flight from a wiped batch don't pollute the new counts
function updateCheckProgress(){
  const box = document.getElementById('checkProgress');
  if(checkProgress.total === 0){ box.style.display = 'none'; return; }
  const finished = checkProgress.done >= checkProgress.total;
  box.style.display = 'block';
  box.classList.toggle('done', finished);
  document.getElementById('checkProgressCount').textContent = `${checkProgress.done} / ${checkProgress.total}`;
  document.getElementById('checkProgressFill').style.width = `${Math.round(checkProgress.done / checkProgress.total * 100)}%`;
  document.getElementById('checkProgressSub').textContent =
    (finished ? '✓ Done' : 'Checking…') + ` · ${checkProgress.removed} hidden by filters`;
}
function resetCheckProgress(){
  checkGeneration++;
  checkProgress.total = checkProgress.done = checkProgress.removed = 0;
  updateCheckProgress();
}

// HUD hides itself when it has nothing to show, and can be collapsed.
const hud = document.getElementById('hud');
function refreshHudVisibility(){
  const hasContent = !!statusLine.textContent ||
    [loadMoreBtn, stopBtn, document.getElementById('listShowMoreBtn')].some(b => b.style.display && b.style.display !== 'none') ||
    document.getElementById('checkProgress').style.display !== 'none';
  hud.classList.toggle('empty', !hasContent);
}
new MutationObserver(refreshHudVisibility).observe(hud, { childList: true, characterData: true, subtree: true, attributes: true, attributeFilter: ['style'] });
document.getElementById('hudCollapse').addEventListener('click', () => {
  const collapsed = hud.classList.toggle('collapsed');
  document.getElementById('hudCollapse').textContent = collapsed ? '+' : '–';
});
let activeDetailFetches = 0;
const detailFetchQueue = [];
function enqueueDetailFetch(task){
  detailFetchQueue.push(task);
  processDetailFetchQueue();
}
function processDetailFetchQueue(){
  while(activeDetailFetches < MAX_CONCURRENT_DETAIL_FETCHES && detailFetchQueue.length > 0){
    const task = detailFetchQueue.shift();
    activeDetailFetches++;
    Promise.resolve(task()).finally(() => {
      activeDetailFetches--;
      processDetailFetchQueue();
    });
  }
}

const runtimeObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if(entry.isIntersecting){
      runtimeObserver.unobserve(entry.target);
      if(entry.target._fetchRuntime) enqueueDetailFetch(entry.target._fetchRuntime);
    }
  });
}, { rootMargin: '300px' }); // start fetching a bit before a card actually enters the viewport

// Multi-select for bulk actions (Skip Selected). Click toggles one card;
// shift-click selects everything between the last-clicked card and this one
// BY DISPLAY ORDER (grid.children), not visual row position — a fixed "skip
// this row" button would break every time the grid reflows at a different
// window width, since "a row" isn't a stable concept in a responsive grid.
// Order-based ranges don't have that problem.
let selectedKeys = new Set();
let lastClickedKey = null;

function handleCardSelectClick(card, m, event){
  if(event.target.closest('.tag-row, .poster-wrap, .copy-link')) return; // don't hijack actual card actions
  const key = keyFor(m);
  const cardsInOrder = [...grid.querySelectorAll('.card')];

  if(event.shiftKey && lastClickedKey !== null){
    const lastIdx = cardsInOrder.findIndex(c => c.dataset.selKey === lastClickedKey);
    const curIdx = cardsInOrder.findIndex(c => c === card);
    if(lastIdx !== -1 && curIdx !== -1){
      const [start, end] = lastIdx < curIdx ? [lastIdx, curIdx] : [curIdx, lastIdx];
      for(let i = start; i <= end; i++){
        const c = cardsInOrder[i];
        selectedKeys.add(c.dataset.selKey);
        c.classList.add('selected');
      }
    }
  } else {
    if(selectedKeys.has(key)){
      selectedKeys.delete(key);
      card.classList.remove('selected');
    } else {
      selectedKeys.add(key);
      card.classList.add('selected');
    }
    lastClickedKey = key;
  }
  updateSelectionBar();
}

function updateSelectionBar(){
  const bar = document.getElementById('selectionBar');
  if(selectedKeys.size === 0){
    bar.style.display = 'none';
  } else {
    bar.style.display = 'flex';
    document.getElementById('selectionCount').textContent = `${selectedKeys.size} selected`;
  }
}

function clearSelection(){
  selectedKeys.clear();
  lastClickedKey = null;
  grid.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
  updateSelectionBar();
}

document.getElementById('clearSelectionBtn').addEventListener('click', clearSelection);
document.getElementById('skipSelectedBtn').addEventListener('click', () => {
  const keysToSkip = [...selectedKeys];
  if(keysToSkip.length === 0) return;
  const matched = loadedMovies.filter(item => keysToSkip.includes(keyFor(item)));
  matched.forEach(m => tagMovie(m, 'ignore', { silent: true }));
  loadedMovies = loadedMovies.filter(item => !keysToSkip.includes(keyFor(item)));
  keysToSkip.forEach(key => {
    grid.querySelector(`.card[data-sel-key="${key}"]`)?.remove();
  });
  saveTags(); // one save for the whole batch, not per item
  const count = keysToSkip.length;
  clearSelection();
  statusLine.textContent = `Skipped ${count} selected title${count===1?'':'s'}.`;
});

function wireTagButtons(tagRowEl, card, m){
  tagRowEl.querySelector('.seen')?.addEventListener('click', () => { tagMovie(m, 'seen'); card.remove(); if(mode==='watchlist' && grid.children.length===0) renderWatchlist(); });
  tagRowEl.querySelector('.watchlist')?.addEventListener('click', () => { tagMovie(m, 'watchlist'); card.remove(); if(mode==='watchlist' && grid.children.length===0) renderWatchlist(); });
  tagRowEl.querySelector('.notify')?.addEventListener('click', () => { tagMovie(m, 'notify'); card.remove(); if(mode==='watchlist' && grid.children.length===0) renderWatchlist(); });
  tagRowEl.querySelector('.ignore')?.addEventListener('click', () => { tagMovie(m, 'ignore'); card.remove(); if(mode==='watchlist' && grid.children.length===0) renderWatchlist(); });
}

function renderCards(movies){
  const eagerCards = [];
  if(movies.length === 0 && grid.children.length === 0) return;
  if(grid.querySelector('.empty-state')) grid.innerHTML = '';
  movies.forEach(m => {
    const year = (m.release_date || '').slice(0,4) || '—';
    const released = isReleased(m);
    const isTv = m.mediaType === 'tv';
    const shortAlready = !isTv && isShortRuntime(m.runtime);
    const card = document.createElement('div');
    card.className = ['card', !released ? 'unreleased' : '', shortAlready ? 'short-title' : ''].filter(Boolean).join(' ');
    card.dataset.id = m.id;
    card.dataset.mediaType = m.mediaType || 'movie';
    card.dataset.selKey = keyFor(m);
    card.dataset.genreIds = JSON.stringify(Array.isArray(m.genre_ids) ? m.genre_ids : []);
    card.addEventListener('click', (e) => handleCardSelectClick(card, m, e));
    const tagRowHtml = released
      ? `<button class="tag-btn seen" title="Mark seen">SEEN</button>
         <button class="tag-btn watchlist" title="Add to watchlist">LATER</button>
         <button class="tag-btn ignore" title="Not interested">SKIP</button>`
      : `<button class="tag-btn notify" title="Notify me when this becomes available">NOTIFY</button>
         <button class="tag-btn ignore" title="Not interested">SKIP</button>`;
    let typeBadgeHtml = '';
    if(isTv) typeBadgeHtml = '<div class="type-badge series-badge">SERIES</div>';
    else if(shortAlready) typeBadgeHtml = '<div class="type-badge short-badge">SHORT</div>';
    const genreName = firstGenreName(m);
    card.innerHTML = `
      <div class="poster-wrap">
        ${m.poster_path ? `<img src="${IMG_BASE}${m.poster_path}" alt="${escapeHtml(m.title)}" loading="lazy">` : `<div class="no-poster">${escapeHtml(m.title)}</div>`}
        ${!released ? '<div class="unreleased-badge">UNRELEASED</div>' : ''}
        ${typeBadgeHtml}
        <div class="genre-badge">${genreName ? escapeHtml(genreName) : ''}</div>
      </div>
      <div class="card-body">
        <p class="card-title">${escapeHtml(m.title)}</p>
        <div class="card-meta">
          <span>${year}</span>
          <span class="meta-rating">★ ${m.vote_average ? m.vote_average.toFixed(1) : '—'}</span>
          <span class="meta-votes">${typeof m.vote_count === 'number' ? formatCompactNumber(m.vote_count) : '—'} votes</span>
        </div>
        <div class="card-actions">
          <div class="tag-row">
            ${tagRowHtml}
          </div>
          <button class="copy-link" title="Copy title and year to clipboard">COPY TITLE</button>
        </div>
      </div>
    `;
    wireTagButtons(card, card, m);
    card.querySelector('.poster-wrap').addEventListener('click', () => {
      window.open(`https://www.themoviedb.org/${m.mediaType === 'tv' ? 'tv' : 'movie'}/${m.id}`, '_blank', 'noopener');
    });
    card.querySelector('.copy-link').addEventListener('click', (e) => {
      copyTitleToClipboard(m.title, year, e.target);
    });
    const posterImg = card.querySelector('.poster-wrap img');
    if(posterImg){
      // Some posters 404 at the w342 size specifically even though the
      // original file exists on TMDb — likely a gap in their resized-image
      // cache rather than a missing poster (confirmed: same titles fail
      // every time, and the poster shows fine on TMDb's own page). So on
      // failure, cascade through larger sizes instead of retrying the same
      // one — 'original' should exist whenever the poster genuinely does.
      const posterSizeFallbacks = ['w500', 'w780', 'original'];
      let posterSizeIndex = 0;
      const posterErrorHandler = () => {
        console.error('Poster failed to load:', posterImg.src, '| poster_path from API:', m.poster_path, '| title:', m.title);
        if(posterSizeIndex < posterSizeFallbacks.length){
          posterImg.src = `https://image.tmdb.org/t/p/${posterSizeFallbacks[posterSizeIndex]}${m.poster_path}`;
          posterSizeIndex++;
        } else {
          posterImg.removeEventListener('error', posterErrorHandler);
          const fallback = document.createElement('div');
          fallback.className = 'no-poster';
          fallback.textContent = m.title;
          posterImg.replaceWith(fallback);
        }
      };
      posterImg.addEventListener('error', posterErrorHandler);
    }
    // Neither runtime (for the SHORT badge) nor a reliably accurate release
    // status (for the UNRELEASED badge) are included in list responses
    // (Trending/Discover/Search) — only the individual detail endpoint has
    // them. A title with messy/incomplete metadata in the list response can
    // get an incorrect UNRELEASED badge even though its actual detail page
    // shows it's released. So both get resolved lazily via one shared
    // detail fetch, and only for cards actually scrolled into view (same
    // principle as the poster images' native lazy loading) — firing this
    // for an entire batch immediately was the cause of real slowdowns.
    const needsRuntimeCheck = !isTv && !shortAlready && typeof m.runtime !== 'number';
    const needsReleaseCheck = !released;
    // Seen/Ignored deliberately never store poster/rating/runtime data (see
    // tagMovie) — that's what cut storage roughly in half at scale. So for
    // just those two categories, fetch a poster lazily to display, but
    // never persist it back to tags: re-fetched fresh each time the section
    // is viewed rather than paying to cache it permanently.
    const isLightweightListView = mode === 'watchlist' && (listCategory === 'seen' || listCategory === 'ignore');
    const needsPosterOnly = isLightweightListView && !m.poster_path;
    if(((needsRuntimeCheck || needsReleaseCheck) && mode !== 'watchlist') || needsPosterOnly){
      const key = apiKeyInput.value.trim();
      if(key){
        card._fetchRuntime = () => {
          return tmdbFetch(`/${isTv ? 'tv' : 'movie'}/${m.id}`).then(detail => {
            if(!detail) return;

            if(needsPosterOnly){
              if(detail.poster_path && card.isConnected){
                const posterWrap = card.querySelector('.poster-wrap');
                const noPosterEl = posterWrap?.querySelector('.no-poster');
                if(noPosterEl){
                  const img = document.createElement('img');
                  img.src = `${IMG_BASE}${detail.poster_path}`;
                  img.alt = m.title;
                  img.loading = 'lazy';
                  noPosterEl.replaceWith(img);
                }
              }
              return; // no persistence, no other checks for this lightweight path
            }

            const patch = {};

            if(needsRuntimeCheck){
              m.runtime = detail.runtime;
              patch.runtime = detail.runtime;
            }

            let finalReleased = released;
            if(needsReleaseCheck){
              const freshDate = isTv ? detail.first_air_date : detail.release_date;
              const availableStatuses = ['Returning Series', 'Ended', 'Canceled', 'Pilot'];
              const nowReleased = detail.status
                ? (isTv ? availableStatuses.includes(detail.status) : detail.status === 'Released')
                : (!!freshDate && freshDate <= todayISO);
              if(nowReleased){
                finalReleased = true;
                m.release_date = freshDate || m.release_date;
                if(card.isConnected){
                  card.classList.remove('unreleased');
                  card.querySelector('.unreleased-badge')?.remove();
                  const tagRowEl = card.querySelector('.tag-row');
                  if(tagRowEl){
                    tagRowEl.innerHTML = `
                      <button class="tag-btn seen" title="Mark seen">SEEN</button>
                      <button class="tag-btn watchlist" title="Add to watchlist">LATER</button>
                      <button class="tag-btn ignore" title="Not interested">SKIP</button>
                    `;
                    wireTagButtons(tagRowEl, card, m);
                  }
                }
              }
            }

            // Short/Regular only ever applies once a title is confirmed
            // released — an unreleased movie frequently has no runtime data
            // at all yet, and that must never get misread as "regular" and
            // checked against the wrong toggle. Unreleased titles are
            // governed purely by the Unreleased toggle, full stop.
            if(!finalReleased){
              if(!document.getElementById('browseShowUnreleased').checked && card.isConnected){
                card.remove();
                checkProgress.removed++;
                loadedMovies = loadedMovies.filter(item => keyFor(item) !== keyFor(m));
              }
            } else if(card.isConnected){
              let category;
              if(isTv){
                category = 'regular';
              } else {
                const rt = needsRuntimeCheck ? detail.runtime : m.runtime;
                category = isShortRuntime(rt) ? 'short' : (typeof rt === 'number' ? 'regular' : null);
              }
              if(category){
                const categoryToggleOn = category === 'short'
                  ? document.getElementById('browseShowShorts').checked
                  : document.getElementById('browseShowRegular').checked;
                if(!categoryToggleOn){
                  card.remove();
                  checkProgress.removed++;
                  loadedMovies = loadedMovies.filter(item => keyFor(item) !== keyFor(m));
                } else if(category === 'short'){
                  card.classList.add('short-title');
                  const posterWrap = card.querySelector('.poster-wrap');
                  if(posterWrap && !posterWrap.querySelector('.type-badge')){
                    const badge = document.createElement('div');
                    badge.className = 'type-badge short-badge';
                    badge.textContent = 'SHORT';
                    posterWrap.appendChild(badge);
                  }
                }
              }
            }

            const tagKey = keyFor(m);
            if(tags[tagKey] && Object.keys(patch).length){ tags[tagKey] = { ...tags[tagKey], ...patch }; dirtyKeys.add(tagKey); }
          });
        };
        // Runtime/release checks run eagerly (bottom-up, see end of
        // renderCards); only the lightweight poster-only path stays lazy.
        if(needsPosterOnly) runtimeObserver.observe(card);
        else eagerCards.push(card);
      }
    }
    grid.appendChild(card);
  });
  // Resolve runtime/release status for the whole batch regardless of
  // scroll position, starting from the LAST card and working upward, so
  // removals happen below/above what you're looking at rather than
  // shifting the cards at the top of the page under your cursor. Cards
  // already gone (new search, tab switch) are skipped without a fetch.
  checkProgress.total += eagerCards.length;
  updateCheckProgress();
  for(let i = eagerCards.length - 1; i >= 0; i--){
    const c = eagerCards[i];
    const gen = checkGeneration;
    const task = () => {
      const p = c.isConnected && c._fetchRuntime ? c._fetchRuntime() : null;
      return Promise.resolve(p).finally(() => { if(gen === checkGeneration){ checkProgress.done++; updateCheckProgress(); } });
    };
    task._eager = true;
    enqueueDetailFetch(task);
  }
  if(grid.children.length === 0){
    grid.innerHTML = mode === 'watchlist'
      ? '<div class="empty-state">Your watchlist is empty. Tag titles LATER from Trending, Discover, or Search.</div>'
      : '<div class="empty-state">Nothing here yet. Try Go, or a different search.</div>';
  }
}

function formatCompactNumber(n){
  try{
    return new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 }).format(n);
  }catch(e){
    return n.toLocaleString();
  }
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

let dirtyKeys = new Set();
function tagMovie(movie, status, options){
  const silent = options && options.silent;
  const type = movie.mediaType || 'movie';
  const key = `${type}-${movie.id}`;
  const existing = tags[key] || {};
  const year = (movie.release_date || '').slice(0,4) || existing.year || '';
  // Seen and Ignored entries only ever render as plain text in the drawer —
  // they never need poster/rating/runtime/language data, unlike Watchlist
  // and Notify, which show full cards. Not storing it for the (usually
  // large majority of) Seen/Ignored entries meaningfully reduces total
  // storage size, which matters directly at scale — localStorage has a
  // real, hard quota per browser (often just 5-10MB) that a large tagged
  // library can genuinely hit.
  const needsFullData = status === 'watchlist' || status === 'notify';
  tags[key] = needsFullData ? {
    id: movie.id,
    mediaType: type,
    title: movie.title || existing.title,
    year,
    status,
    poster_path: movie.poster_path !== undefined ? movie.poster_path : existing.poster_path,
    vote_average: typeof movie.vote_average === 'number' ? movie.vote_average : existing.vote_average,
    vote_count: typeof movie.vote_count === 'number' ? movie.vote_count : existing.vote_count,
    runtime: typeof movie.runtime === 'number' ? movie.runtime : existing.runtime,
    original_language: movie.original_language !== undefined ? movie.original_language : existing.original_language,
    genre_ids: Array.isArray(movie.genre_ids) ? movie.genre_ids : existing.genre_ids
  } : {
    id: movie.id,
    mediaType: type,
    title: movie.title || existing.title,
    year,
    status
  };
  dirtyKeys.add(key);
  if(!silent){
    saveTags();
    loadedMovies = loadedMovies.filter(item => keyFor(item) !== key);
  }
}

function untagMovie(id){
  delete tags[id];
  dirtyKeys.add(id);
  saveTags();
}

// Fast path: writes only the record(s) touched since the last save — not
// the whole dataset — via saveKeysToDB. IndexedDB writes don't block the
// main thread, and each key is independent, so a reload can never lose it
// and this stays fast regardless of how large the overall list gets.
function saveTags(){
  if(dirtyKeys.size > 0){
    saveKeysToDB([...dirtyKeys]); // fire-and-forget — IndexedDB handles this reliably in the background
    dirtyKeys.clear();
  }
  renderDrawer();
}

// Reconciles with storage — pulls in anything saved by another tab/session
// while this one wasn't focused. Only runs when the tab regains visibility,
// which is the one point a stale tab could plausibly have drifted from
// what's actually on disk — not on every click, where the same check would
// just be wasted work. IndexedDB deletions are native (no separate
// "pendingDeletions" tracking needed the way the old localStorage merge
// required), since a deleted key simply isn't returned by the store anymore.
async function reconcileTagsFromStorage(){
  try{
    const currentStored = await loadAllTagsFromDB() || {};
    tags = { ...currentStored, ...tags };
  }catch(e){ /* if storage is corrupt/unreadable, keep this tab's own in-memory copy as-is */ }
  renderDrawer();
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') reconcileTagsFromStorage();
});

// For periodic checkpoints during longer background operations (watchlist
// scan progress, self-heal) where merging is worth the occasional cost —
// unlike the per-click path, these don't run often enough for it to matter.
async function saveTagsWithReconcile(){
  await reconcileTagsFromStorage();
  if(dirtyKeys.size > 0){
    await saveKeysToDB([...dirtyKeys]);
    dirtyKeys.clear();
  } else {
    await saveAllKeysToDB(); // reconciliation may have pulled in changes this tab didn't originate — safe to persist all as a checkpoint
  }
}

document.querySelectorAll('.drawer-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.drawer-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeDrawerTab = btn.dataset.status;
    drawerVisibleCount = drawerPageSize;
    document.getElementById('notifyControls').style.display = activeDrawerTab === 'notify' ? 'flex' : 'none';
    document.getElementById('watchlistControls').style.display = activeDrawerTab === 'watchlist' ? 'flex' : 'none';
    renderDrawer();
  });
});

function renderDrawer(){
  const allIds = Object.keys(tags);
  const byStatus = { seen: [], watchlist: [], notify: [], ignore: [] };
  allIds.forEach(id => { if(byStatus[tags[id].status]) byStatus[tags[id].status].push(id); });

  document.getElementById('totalTagCount').textContent = allIds.length;
  document.getElementById('countSeen').textContent = byStatus.seen.length;
  document.getElementById('countWatchlist').textContent = byStatus.watchlist.length;
  document.getElementById('countNotify').textContent = byStatus.notify.length;
  document.getElementById('countIgnore').textContent = byStatus.ignore.length;

  // The list itself (sort + DOM build) is expensive with a large tagged
  // library, and this function runs on every single tag action regardless
  // of whether the drawer is even open. Skip that work entirely while
  // closed — counts above are cheap and always kept current, but the
  // actual list only needs to exist when it's visible.
  if(!document.getElementById('drawer').classList.contains('open')) return;

  const sortedIds = byStatus[activeDrawerTab]
    .sort((a,b) => sortableTitle(tags[a].title).localeCompare(sortableTitle(tags[b].title)));
  const list = document.getElementById('watchedList');

  if(sortedIds.length === 0){
    const labels = { seen: 'seen', watchlist: 'watchlisted', notify: 'on your notify list', ignore: 'ignored' };
    list.innerHTML = `<div class="empty-state" style="padding:20px 0;">Nothing ${labels[activeDrawerTab]} yet.</div>`;
    return;
  }

  const visibleIds = sortedIds.slice(0, drawerVisibleCount);
  const remaining = sortedIds.length - visibleIds.length;

  list.innerHTML = visibleIds.map(id => {
    const t = tags[id];
    const url = `https://www.themoviedb.org/${t.mediaType === 'tv' ? 'tv' : 'movie'}/${t.id}`;
    return `
      <div class="watched-item">
        <div><a class="wi-title" href="${url}" target="_blank" rel="noopener">${escapeHtml(t.title)}</a><span class="wi-year">${t.year || ''}</span></div>
        <button data-id="${id}">remove</button>
      </div>
    `;
  }).join('');

  if(remaining > 0){
    list.innerHTML += `<button class="drawer-show-more" id="drawerShowMore">Show ${Math.min(remaining, drawerPageSize)} more (${remaining} left)</button>`;
  }

  list.querySelectorAll('button[data-id]').forEach(btn => {
    btn.addEventListener('click', () => untagMovie(btn.dataset.id));
  });
  const showMoreBtn = document.getElementById('drawerShowMore');
  if(showMoreBtn){
    showMoreBtn.addEventListener('click', () => {
      drawerVisibleCount += drawerPageSize;
      renderDrawer();
    });
  }
}

document.getElementById('drawerToggle').addEventListener('click', () => {
  document.getElementById('drawer').classList.add('open');
  renderDrawer();
});
document.getElementById('drawerClose').addEventListener('click', () => {
  document.getElementById('drawer').classList.remove('open');
});

const backToTopBtn = document.getElementById('backToTop');
backToTopBtn.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
window.addEventListener('scroll', () => {
  backToTopBtn.style.display = window.scrollY > 600 ? 'block' : 'none';
});

function exportTagsAsJson(){
  const blob = new Blob([JSON.stringify(tags, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'unseen-lists.json';
  a.click();
}
document.getElementById('exportBtn').addEventListener('click', exportTagsAsJson);
document.getElementById('quickExportBtn').addEventListener('click', exportTagsAsJson);

document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try{
      const imported = JSON.parse(evt.target.result);
      // support importing the current composite-key format, or older flat/plain-id exports
      for(const rawId in imported){
        const entry = imported[rawId];
        const key = /^\d+$/.test(rawId) ? `movie-${rawId}` : rawId;
        const normalized = entry.status ? { ...entry } : { title: entry.title, year: entry.year, status: 'seen' };
        if(normalized.id === undefined) normalized.id = Number(key.split('-').slice(1).join('-')) || Number(rawId) || undefined;
        if(!normalized.mediaType) normalized.mediaType = key.startsWith('tv-') ? 'tv' : 'movie';
        tags[key] = normalized;
        dirtyKeys.add(key);
      }
      saveTags();
      statusLine.textContent = 'Import complete.';
    }catch(err){
      alert('Could not parse that file as JSON.');
    }
  };
  reader.readAsText(file);
});

renderDrawer();

// ---- Notify list: availability checking ----
// Runs only while this page is open — there's no way for a static local
// file to wake up in the background. On load, if 24+ hours have passed
// since the last check (or it's never run), it checks automatically.
// A manual "Check availability now" button covers everything in between.

const NOTIFY_CHECK_STORAGE = 'unseen_last_notify_check';
const NOTIFY_INTERVAL_MS = 24 * 60 * 60 * 1000;

const checkNowBtn = document.getElementById('checkNowBtn');
const scanWatchlistBtn = document.getElementById('scanWatchlistBtn');
const scanStatusLabel = document.getElementById('scanStatusLabel');
const enableNotifBtn = document.getElementById('enableNotifBtn');
const lastCheckLabel = document.getElementById('lastCheckLabel');
const availabilityBanner = document.getElementById('availabilityBanner');

function updateLastCheckLabel(){
  const last = parseInt(localStorage.getItem(NOTIFY_CHECK_STORAGE), 10);
  if(!last){ lastCheckLabel.textContent = 'Never checked yet.'; return; }
  const mins = Math.round((Date.now() - last) / 60000);
  const text = mins < 60 ? `${mins} min ago` : mins < 1440 ? `${Math.round(mins/60)} hr ago` : `${Math.round(mins/1440)} day(s) ago`;
  lastCheckLabel.textContent = `Last checked: ${text}`;
}
updateLastCheckLabel();

function updateEnableNotifBtn(){
  if(!('Notification' in window)){
    enableNotifBtn.textContent = 'Alerts unsupported in this browser';
    enableNotifBtn.disabled = true;
  } else if(Notification.permission === 'granted'){
    enableNotifBtn.textContent = 'Browser alerts enabled ✓';
  } else if(Notification.permission === 'denied'){
    enableNotifBtn.textContent = 'Alerts blocked — check browser settings';
  } else {
    enableNotifBtn.textContent = 'Enable browser alerts';
  }
}
updateEnableNotifBtn();

enableNotifBtn.addEventListener('click', async () => {
  if(!('Notification' in window)) return;
  await Notification.requestPermission();
  updateEnableNotifBtn();
});

function isNowAvailable(detail, mediaType){
  if(!detail) return false;
  if(mediaType === 'tv'){
    const availableStatuses = ['Returning Series', 'Ended', 'Canceled', 'Pilot'];
    if(detail.status) return availableStatuses.includes(detail.status);
    return (detail.first_air_date || '') <= todayISO && !!detail.first_air_date;
  }
  if(detail.status) return detail.status === 'Released';
  return (detail.release_date || '') <= todayISO && !!detail.release_date;
}

// Reverse of the notify check: some watchlist entries predate the Notify
// feature and were saved back when everything just landed on the Watchlist
// tab regardless of release status. This finds any of those that are
// actually still unreleased and demotes them to Notify. Scans the entire
// watchlist rather than pre-filtering by year — an old stored year can
// still coexist with a genuine "Post Production" status on TMDb (delayed
// re-releases, restorations, messy catalog entries), so a year filter
// would miss exactly those outliers. This means one TMDb request per
// watchlist title, so a large watchlist can take a few minutes — progress
// is saved every 20 titles, so closing the tab mid-scan doesn't lose what
// was already found.
async function scanWatchlistForUnreleased(){
  const key = apiKeyInput.value.trim();
  if(!key){
    alert('Paste your TMDb API key at the top first.');
    return;
  }
  const candidates = Object.keys(tags).filter(k => tags[k].status === 'watchlist');

  if(candidates.length === 0){
    alert('Your watchlist is empty — nothing to scan.');
    return;
  }
  if(!confirm(`This will check all ${candidates.length} watchlist titles against TMDb, one at a time — it may take a few minutes. Continue?`)) return;

  scanWatchlistBtn.disabled = true;
  const movedToNotify = [];

  for(let i = 0; i < candidates.length; i++){
    scanWatchlistBtn.textContent = `Scanning ${i+1}/${candidates.length}...`;
    const tagKey = candidates[i];
    const entry = tags[tagKey];
    const mediaType = entry.mediaType || 'movie';
    const detail = await tmdbFetch(`/${mediaType}/${entry.id}`);
    if(detail && !isNowAvailable(detail, mediaType)){
      tags[tagKey] = { ...entry, status: 'notify' };
      dirtyKeys.add(tagKey);
      movedToNotify.push(entry.title);
    }
    if(i % 20 === 19) saveTagsWithReconcile(); // save progress periodically, merging with current storage instead of overwriting it
  }

  scanWatchlistBtn.disabled = false;
  scanWatchlistBtn.textContent = 'Scan watchlist for unreleased titles';
  scanStatusLabel.textContent = `Last scan: checked ${candidates.length} title(s), moved ${movedToNotify.length} to Notify.`;

  if(movedToNotify.length > 0){
    saveTags();
    alert(`Moved ${movedToNotify.length} unreleased title(s) to Notify:\n${movedToNotify.join(', ')}`);
  } else {
    saveTags();
    alert(`Checked ${candidates.length} watchlist title(s) — everything is actually already released.`);
  }
}

scanWatchlistBtn.addEventListener('click', scanWatchlistForUnreleased);

['filterMovies', 'filterSeries', 'filterShorts', 'filterUnreleased'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => {
    if(mode === 'watchlist') renderWatchlist();
  });
});

function showAvailabilityBanner(titles){
  availabilityBanner.innerHTML = `
    <span>🎬 Now available — moved to your Watchlist: ${titles.map(t => escapeHtml(t)).join(', ')}</span>
    <button id="dismissBanner" title="Dismiss">×</button>
  `;
  availabilityBanner.style.display = 'flex';
  document.getElementById('dismissBanner').addEventListener('click', () => {
    availabilityBanner.style.display = 'none';
  });
}

async function checkNotifyList(manual){
  const key = apiKeyInput.value.trim();
  if(!key){
    if(manual) alert('Paste your TMDb API key at the top first.');
    return;
  }
  const notifyKeys = Object.keys(tags).filter(k => tags[k].status === 'notify');
  if(notifyKeys.length === 0){
    if(manual) alert('Nothing on your notify list yet.');
    localStorage.setItem(NOTIFY_CHECK_STORAGE, String(Date.now()));
    updateLastCheckLabel();
    return;
  }

  if(manual){ checkNowBtn.disabled = true; checkNowBtn.textContent = 'Checking...'; }

  const newlyAvailable = [];
  for(const tagKey of notifyKeys){
    const entry = tags[tagKey];
    const mediaType = entry.mediaType || 'movie';
    const detail = await tmdbFetch(`/${mediaType}/${entry.id}`);
    if(isNowAvailable(detail, mediaType)){
      tags[tagKey] = { ...entry, status: 'watchlist' };
      dirtyKeys.add(tagKey);
      newlyAvailable.push(entry.title);
    }
  }

  localStorage.setItem(NOTIFY_CHECK_STORAGE, String(Date.now()));
  updateLastCheckLabel();

  if(newlyAvailable.length > 0){
    saveTags();
    showAvailabilityBanner(newlyAvailable);
    if('Notification' in window && Notification.permission === 'granted'){
      new Notification('New titles available', {
        body: newlyAvailable.join(', ')
      });
    }
  }

  if(manual){
    checkNowBtn.disabled = false;
    checkNowBtn.textContent = 'Check availability now';
    if(newlyAvailable.length === 0) alert('Checked — nothing on your notify list is available yet.');
  }
}

checkNowBtn.addEventListener('click', () => checkNotifyList(true));

// Auto-check on load if 24+ hours have passed (or it's never run)
(function autoCheckNotifyList(){
  const last = parseInt(localStorage.getItem(NOTIFY_CHECK_STORAGE), 10);
  if(last && (Date.now() - last) < NOTIFY_INTERVAL_MS) return;
  const hasNotifyItems = Object.values(tags).some(t => t.status === 'notify');
  const hasKey = apiKeyInput.value.trim().length > 0;
  if(hasNotifyItems && hasKey) checkNotifyList(false);
})();

</script>
