<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unseen — TMDb Watched Filter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1c1a16;
    --bg-card: #262319;
    --bg-card-hover: #2d2a20;
    --line: #3a3527;
    --accent: #e2a63b;
    --accent-dim: #a97e30;
    --seen: #6b9c8f;
    --remove: #b8563f;
    --text: #ece6d6;
    --text-dim: #948d7a;
    --text-faint: #625c4c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .sprockets{
    height:14px;
    background-image: repeating-linear-gradient(90deg, var(--bg) 0px, var(--bg) 10px, var(--line) 10px, var(--line) 16px);
    background-color: #0f0e0c;
    position:relative;
  }
  .sprockets::before, .sprockets::after{
    content:"";
    position:absolute;
    top:3px;
    left:0; right:0;
    height:8px;
    background-image: repeating-linear-gradient(90deg, transparent 0px, transparent 4px, var(--bg) 4px, var(--bg) 12px);
  }
  header{
    padding:28px 32px 20px;
    background:#0f0e0c;
    border-bottom:1px solid var(--line);
  }
  .header-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:16px;
    max-width:1200px;
    margin:0 auto;
  }
  h1{
    font-family:'Bebas Neue', sans-serif;
    font-size:44px;
    letter-spacing:3px;
    color:var(--accent);
    margin:0;
    line-height:1;
  }
  h1 span{color:var(--text-dim); font-size:20px; letter-spacing:2px; display:block; font-family:'IBM Plex Mono',monospace; margin-top:4px;}
  .key-box{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--text-dim);
  }
  .key-box input{
    background:var(--bg-card);
    border:1px solid var(--line);
    color:var(--text);
    padding:8px 10px;
    border-radius:4px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    width:220px;
  }
  .key-box input:focus{outline:1px solid var(--accent); border-color:var(--accent);}
  .key-box select{
    background:var(--bg-card);
    border:1px solid var(--line);
    color:var(--text);
    padding:8px 10px;
    border-radius:4px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
  }
  .key-box a{color:var(--accent); text-decoration:none;}
  .key-box a:hover{text-decoration:underline;}

  main{max-width:1200px; margin:0 auto; padding:28px 32px 80px;}

  .controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    margin-bottom:24px;
  }
  .type-toggle{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .type-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:7px 18px;
    border-radius:20px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    letter-spacing:0.5px;
  }
  .type-btn.active{background:var(--text); color:var(--bg); border-color:var(--text);}
  .type-btn:hover:not(.active){border-color:var(--accent-dim); color:var(--text);}

  .tab{
    background:none;
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:9px 16px;
    border-radius:20px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    letter-spacing:0.3px;
  }
  .tab.active{background:var(--accent); border-color:var(--accent); color:#1c1a16;}
  .tab:hover:not(.active){border-color:var(--accent-dim); color:var(--text);}

  .search-row{display:flex; gap:8px; flex:1; min-width:240px;}
  .rating-filter{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--text-dim);
  }
  .rating-filter input{width:56px; text-align:center;}
  .rating-filter span, .year-filter span{color:var(--text-faint);}
  .year-filter{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--text-dim);
  }
  .year-filter input{width:64px; text-align:center;}
  .year-filter select{padding:10px 6px; font-size:12px;}
  .sort-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--text-dim);
  }
  .sort-toggle #resortBtn{
    background:none;
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:8px 10px;
    border-radius:6px;
    font-size:13px;
    cursor:pointer;
    line-height:1;
  }
  .sort-toggle #resortBtn:hover{border-color:var(--accent); color:var(--accent);}
  input[type=text], select{
    background:var(--bg-card);
    border:1px solid var(--line);
    color:var(--text);
    padding:10px 12px;
    border-radius:6px;
    font-family:'Inter',sans-serif;
    font-size:14px;
  }
  input[type=text]{flex:1;}
  input[type=text]:focus, select:focus{outline:none; border-color:var(--accent);}
  button.primary{
    background:var(--accent);
    color:#1c1a16;
    border:none;
    padding:10px 18px;
    border-radius:6px;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    letter-spacing:0.3px;
  }
  button.primary:hover{background:#eab655;}
  button.primary:disabled{opacity:0.5; cursor:default;}
  .skip-all-btn{
    background:none;
    border:1px solid var(--remove);
    color:var(--remove);
    padding:10px 18px;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    letter-spacing:0.3px;
    font-family:'Inter',sans-serif;
  }
  .skip-all-btn:hover{background:var(--remove); color:#ece6d6;}

  .status-line{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--text-faint);
    margin-bottom:18px;
    min-height:16px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(170px,1fr));
    gap:18px;
  }
  .card{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    transition:transform 0.15s ease, border-color 0.15s ease;
    position:relative;
    display:flex;
    flex-direction:column;
    height:100%;
  }
  .card:hover{transform:translateY(-3px); border-color:var(--accent-dim); background:var(--bg-card-hover);}
  .card.unreleased{background:#3d2f12; border:1px solid var(--accent);}
  .card.unreleased:hover{background:#493a17; border-color:var(--accent);}
  .card.short-title{background:#1c2a3d; border:1px solid #3d6a99;}
  .card.short-title:hover{background:#22334a; border-color:#4d84bd;}
  .poster-wrap{position:relative; aspect-ratio:2/3; background:#0f0e0c; cursor:pointer;}
  .unreleased-badge{
    position:absolute; top:8px; left:8px;
    background:rgba(226,166,59,0.92);
    color:#1c1a16;
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    font-weight:700;
    letter-spacing:0.5px;
    padding:3px 7px;
    border-radius:4px;
  }
  .type-badge{
    position:absolute; top:8px; right:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    font-weight:700;
    letter-spacing:0.5px;
    padding:3px 7px;
    border-radius:4px;
    color:#1c1a16;
  }
  .type-badge.series-badge{background:rgba(107,156,143,0.92);}
  .type-badge.short-badge{background:rgba(148,141,122,0.92);}
  .genre-badge{
    position:absolute; bottom:8px; left:8px;
    background:rgba(20,18,15,0.78);
    color:var(--text-dim);
    font-family:'IBM Plex Mono',monospace;
    font-size:9px;
    font-weight:600;
    letter-spacing:0.3px;
    padding:3px 7px;
    border-radius:4px;
    max-width:calc(100% - 16px);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .genre-badge:empty{display:none;}
  .tag-btn.notify:hover{border-color:var(--accent); color:var(--accent); border-style:solid;}
  .poster-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
  .no-poster{
    display:flex; align-items:center; justify-content:center; height:100%;
    color:var(--text-faint); font-family:'IBM Plex Mono',monospace; font-size:11px; text-align:center; padding:10px;
  }
  .card-body{padding:10px 12px 12px; display:flex; flex-direction:column; flex:1;}
  .card-title{
    font-weight:600;
    font-size:13.5px;
    line-height:1.3;
    margin:0 0 3px;
    color:var(--text);
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    min-height:calc(1.3em * 2);
  }
  .card-meta{
    display:flex;
    align-items:center;
    flex-wrap:nowrap;
    gap:4px 6px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--text-faint);
    margin-bottom:10px;
    white-space:nowrap;
    overflow:hidden;
  }
  .card-meta .meta-rating{color:var(--accent); flex-shrink:0;}
  .card-meta .meta-votes{overflow:hidden; text-overflow:ellipsis;}
  .card-actions{
    margin-top:auto;
  }
  .tag-row{
    display:flex;
    gap:4px;
  }
  .tag-btn{
    flex:1;
    background:none;
    border:1px dashed var(--line);
    color:var(--text-faint);
    padding:6px 0;
    border-radius:5px;
    font-size:9.5px;
    font-family:'IBM Plex Mono',monospace;
    cursor:pointer;
    letter-spacing:0.3px;
  }
  .tag-btn.seen:hover{border-color:var(--seen); color:var(--seen); border-style:solid;}
  .tag-btn.watchlist:hover{border-color:var(--accent); color:var(--accent); border-style:solid;}
  .tag-btn.ignore:hover{border-color:var(--remove); color:var(--remove); border-style:solid;}
  .copy-link{
    display:block;
    width:100%;
    margin-top:5px;
    background:none;
    border:none;
    color:var(--text-faint);
    padding:5px 0 0;
    font-size:10px;
    font-family:'IBM Plex Mono',monospace;
    cursor:pointer;
    text-align:center;
    letter-spacing:0.3px;
  }
  .copy-link:hover{color:var(--accent);}

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--text-faint);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
  }

  .load-more{
    display:block;
    margin:28px auto 0;
    background:none;
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:10px 22px;
    border-radius:20px;
    font-size:13px;
    cursor:pointer;
  }
  .load-more:hover{border-color:var(--accent); color:var(--accent);}
  .stop-btn{border-color:var(--remove); color:var(--remove);}
  .stop-btn:hover{background:var(--remove); color:#ece6d6;}

  /* Left-side HUD: Show more / Stop / status / check progress */
  .hud{
    position:fixed;
    left:16px; top:50%;
    transform:translateY(-50%);
    width:210px;
    max-height:calc(100vh - 260px);
    overflow:auto;
    background:rgba(28,26,22,0.97);
    backdrop-filter:blur(6px);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:0 4px 16px rgba(0,0,0,0.4);
    z-index:40;
    font-family:'IBM Plex Mono',monospace;
  }
  .hud.empty{display:none;}
  .hud-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 10px;
    font-size:10px; letter-spacing:1px; color:var(--text-faint);
    border-bottom:1px solid var(--line);
  }
  .hud.collapsed .hud-head{border-bottom:none;}
  .hud-head button{
    background:none; border:none; color:var(--text-dim);
    cursor:pointer; font-size:14px; line-height:1; padding:0 2px;
  }
  .hud.collapsed .hud-body{display:none;}
  .hud-body{padding:10px; display:flex; flex-direction:column; gap:8px;}
  .hud .load-more{margin:0; width:100%; padding:8px 10px; font-size:12px;}
  .hud .status-line{margin:0; min-height:0; text-align:left; line-height:1.4; word-break:break-word;}
  .hud .status-line:empty{display:none;}
  .hud-progress{border-top:1px solid var(--line); padding-top:8px; font-size:11px; color:var(--text-dim);}
  .hud-progress-label{display:flex; justify-content:space-between; gap:6px; margin-bottom:5px;}
  .hud-progress-bar{height:5px; background:var(--line); border-radius:3px; overflow:hidden;}
  .hud-progress-fill{height:100%; width:0; background:var(--accent); transition:width 0.2s ease;}
  .hud-progress.done .hud-progress-fill{background:#6b9c8f;}
  .hud-progress-sub{margin-top:5px; color:var(--text-faint); font-size:10.5px;}
  @media (max-width:900px){
    .hud{left:8px; right:8px; width:auto; top:auto; bottom:130px; transform:none; max-height:40vh;}
  }

  /* Watched drawer */
  .drawer-toggle{
    position:fixed;
    bottom:24px; right:24px;
    background:var(--accent);
    color:#1c1a16;
    border:none;
    padding:12px 18px;
    border-radius:24px;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    box-shadow:0 4px 16px rgba(0,0,0,0.4);
    font-family:'IBM Plex Mono',monospace;
    z-index:50;
  }
  .back-to-top{
    position:fixed;
    bottom:24px; left:24px;
    background:var(--bg-card);
    color:var(--accent);
    border:1px solid var(--line);
    padding:12px 18px;
    border-radius:24px;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    box-shadow:0 4px 16px rgba(0,0,0,0.4);
    font-family:'IBM Plex Mono',monospace;
    z-index:50;
    display:none;
  }
  .back-to-top:hover{border-color:var(--accent); background:var(--bg-card-hover);}
  .quick-export-btn{
    background:var(--bg-card);
    color:var(--text-dim);
    border:1px solid var(--line);
  }
  .quick-export-btn:hover{border-color:var(--accent); color:var(--accent);}
  .drawer{
    position:fixed;
    top:0; right:-380px;
    width:360px;
    height:100%;
    background:#0f0e0c;
    border-left:1px solid var(--line);
    padding:24px 20px;
    overflow-y:auto;
    transition:right 0.25s ease;
    z-index:60;
  }
  .drawer.open{right:0;}
  .drawer h2{
    font-family:'Bebas Neue', sans-serif;
    color:var(--accent);
    letter-spacing:2px;
    font-size:24px;
    margin:0 0 4px;
  }
  .drawer .sub{color:var(--text-faint); font-family:'IBM Plex Mono',monospace; font-size:11px; margin-bottom:14px;}
  .drawer-tabs{display:flex; gap:6px; margin-bottom:16px;}
  .drawer-tab{
    flex:1;
    background:none;
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:7px 0;
    border-radius:16px;
    font-size:11px;
    font-family:'IBM Plex Mono',monospace;
    cursor:pointer;
  }
  .drawer-tab.active{background:var(--accent); border-color:var(--accent); color:#1c1a16; font-weight:600;}
  .drawer-tab.active[data-status="watchlist"]{background:var(--accent); border-color:var(--accent);}
  .drawer-tab.active[data-status="notify"]{background:#c98f2b; border-color:#c98f2b; color:#1c1a16;}
  .drawer-tab.active[data-status="ignore"]{background:var(--remove); border-color:var(--remove); color:#ece6d6;}
  .drawer-tab.active[data-status="seen"]{background:var(--seen); border-color:var(--seen); color:#1c1a16;}
  .drawer-close{
    position:absolute; top:20px; right:18px;
    background:none; border:none; color:var(--text-dim); font-size:20px; cursor:pointer;
  }
  .watched-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .watched-item .wi-title{color:var(--text); text-decoration:none;}
  .watched-item .wi-title:hover{color:var(--accent); text-decoration:underline;}
  .watched-item .wi-year{color:var(--text-faint); font-family:'IBM Plex Mono',monospace; font-size:11px; margin-left:6px;}
  .watched-item button{
    background:none; border:none; color:var(--remove); cursor:pointer; font-size:11px;
    font-family:'IBM Plex Mono',monospace;
  }
  .watched-item button:hover{text-decoration:underline;}
  .drawer-show-more{
    display:block;
    width:100%;
    margin-top:12px;
    background:none;
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:9px 0;
    border-radius:6px;
    font-size:12px;
    font-family:'IBM Plex Mono',monospace;
    cursor:pointer;
  }
  .drawer-show-more:hover{border-color:var(--accent); color:var(--accent);}
  .drawer-actions{display:flex; gap:8px; margin-top:18px;}
  .notify-controls{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-bottom:14px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .notify-controls button{
    background:var(--bg-card);
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:8px 10px;
    border-radius:6px;
    font-size:11.5px;
    font-family:'IBM Plex Mono',monospace;
    cursor:pointer;
  }
  .notify-controls button:hover{border-color:var(--accent); color:var(--accent);}
  .notify-sub{color:var(--text-faint); font-family:'IBM Plex Mono',monospace; font-size:10.5px;}
  .type-filter-row{display:flex; gap:14px; flex-wrap:wrap;}
  .list-category-row{display:flex; gap:8px; flex-wrap:wrap;}
  .list-cat-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:8px 16px;
    border-radius:16px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    font-family:'IBM Plex Mono',monospace;
  }
  .list-cat-btn.active{background:var(--text); color:var(--bg); border-color:var(--text);}
  .list-cat-btn:hover:not(.active){border-color:var(--accent-dim); color:var(--text);}
  .list-search-row{display:flex; align-items:center; gap:12px; flex:1; min-width:220px;}
  .list-search-row input[type=text]{flex:1; min-width:160px;}
  .az-index{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
    margin-bottom:14px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .az-letter{
    background:none;
    border:1px solid var(--line);
    color:var(--text-faint);
    width:26px; height:26px;
    border-radius:4px;
    font-size:11px;
    font-family:'IBM Plex Mono',monospace;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .az-letter:hover{border-color:var(--accent); color:var(--accent);}
  .az-letter.az-empty{opacity:0.25; cursor:default; pointer-events:none;}
  .type-filter-check{
    display:flex;
    align-items:center;
    gap:5px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--text-dim);
    cursor:pointer;
  }
  .type-filter-check input{accent-color:var(--accent); cursor:pointer;}
  .availability-banner{
    max-width:1200px;
    margin:0 auto 18px;
    padding:14px 18px;
    background:rgba(226,166,59,0.12);
    border:1px solid var(--accent-dim);
    border-radius:8px;
    color:var(--text);
    font-size:13.5px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
  }
  .availability-banner button{
    background:none;
    border:none;
    color:var(--text-faint);
    font-size:18px;
    cursor:pointer;
    line-height:1;
  }
  .selection-bar{
    position:fixed;
    top:20px; left:50%;
    transform:translateX(-50%);
    background:var(--bg-card);
    border:1px solid var(--accent);
    border-radius:24px;
    padding:10px 12px 10px 18px;
    box-shadow:0 4px 20px rgba(0,0,0,0.5);
    display:flex;
    align-items:center;
    gap:12px;
    z-index:200;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--text);
  }
  .selection-bar button{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    font-weight:700;

<script>
const API_BASE = 'https://api.themoviedb.org/3';
const IMG_BASE = 'https://image.tmdb.org/t/p/w342';
const KEY_STORAGE = 'unseen_tmdb_key';

// Storage lives in IndexedDB now, not localStorage. localStorage is capped
// at a fixed ~5-10MB per site in every major browser, with no user-facing
// way to raise it — that's a hard spec limit, not tied to actual free disk
// space. IndexedDB has no such fixed ceiling; its quota scales with
// available disk space (often hundreds of MB to GB), which is what a
// tagged library in the tens of thousands of titles actually needs.
// IndexedDB is also a genuine key-value store, so each tag is its own
// independent record — no more manual "sharding" trick to avoid
// re-serializing the whole dataset on every click; that problem doesn't
// exist here in the first place.
const DB_NAME = 'UnseenDB';
const DB_VERSION = 1;
const STORE_NAME = 'tags';
let dbInstancePromise = null;
function openDB(){
  if(dbInstancePromise) return dbInstancePromise;
  dbInstancePromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbInstancePromise;
}

async function loadAllTagsFromDB(){
  try{
    const db = await openDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const result = {};
      const req = store.openCursor();
      req.onsuccess = (e) => {
        const cursor = e.target.result;
        if(cursor){ result[cursor.key] = cursor.value; cursor.continue(); }
        else resolve(Object.keys(result).length ? result : null);
      };
      req.onerror = () => reject(req.error);
    });
  }catch(e){
    console.error('Failed to load from IndexedDB', e);
    return null;
  }
}

// Writes only the specific keys that changed. Deleted keys (removed from
// the in-memory tags object) are deleted from the store, not left stale.
async function saveKeysToDB(keys){
  try{
    const db = await openDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      keys.forEach(k => { if(k in tags) store.put(tags[k], k); else store.delete(k); });
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){
    console.error('Failed to save to IndexedDB', e);
    showStorageErrorBanner(e);
  }
}

async function saveAllKeysToDB(){
  await saveKeysToDB(Object.keys(tags));
}

async function showStorageErrorBanner(e){
  const banner = document.getElementById('storageErrorBanner');
  if(!banner) return;
  let usageNote = '';
  try{
    if(navigator.storage && navigator.storage.estimate){
      const { usage, quota } = await navigator.storage.estimate();
      usageNote = ` (roughly ${(usage/1024/1024).toFixed(1)}MB used of an estimated ${(quota/1024/1024).toFixed(0)}MB available)`;
    }
  }catch(err){ /* the estimate is a bonus, not essential */ }
  banner.innerHTML = `
    <span>⚠️ A save just failed — your last change may not have been saved: ${escapeHtml(e && e.message || String(e))}${usageNote}.</span>
    <button id="dismissStorageError" title="Dismiss">×</button>
  `;
  banner.style.display = 'flex';
  document.getElementById('dismissStorageError').addEventListener('click', () => {
    banner.style.display = 'none';
  });
}

// One-time migration from the old localStorage-based formats (sharded v3,
// single-blob v2, or original v1) into IndexedDB, then frees that
// localStorage space entirely. Only runs if IndexedDB is genuinely empty —
// once migrated, this never touches localStorage again.
async function migrateFromLocalStorageIfNeeded(){
  const OLD_NUM_SHARDS = 16;
  const oldShardKey = (i) => `unseen_tags_v3_shard_${i}`;
  let migrated = {};
  let anyFound = false;
  for(let i = 0; i < OLD_NUM_SHARDS; i++){
    const raw = localStorage.getItem(oldShardKey(i));
    if(raw){
      anyFound = true;
      try{ Object.assign(migrated, JSON.parse(raw)); }catch(e){ /* skip a corrupt shard */ }
    }
  }
  if(!anyFound){
    const blob = JSON.parse(localStorage.getItem('unseen_tags_v2') || 'null');
    if(blob){
      anyFound = true;
      for(const key in blob){
        if(/^\d+$/.test(key)) migrated[`movie-${key}`] = { ...blob[key], id: Number(key), mediaType: 'movie' };
        else migrated[key] = blob[key];
      }
    } else {
      const old = JSON.parse(localStorage.getItem('unseen_watched_v1') || '{}');
      for(const id in old){
        anyFound = true;
        migrated[`movie-${id}`] = { id: Number(id), mediaType: 'movie', title: old[id].title, year: old[id].year, status: 'seen' };
      }
    }
  }
  if(anyFound && Object.keys(migrated).length){
    tags = { ...migrated, ...tags }; // preserve anything tagged in the brief window before this completed
    await saveAllKeysToDB();
    for(let i = 0; i < OLD_NUM_SHARDS; i++){ try{ localStorage.removeItem(oldShardKey(i)); }catch(e){} }
    try{ localStorage.removeItem('unseen_tags_v2'); }catch(e){}
    try{ localStorage.removeItem('unseen_watched_v1'); }catch(e){}
  }
}

// One-time cleanup: trim already-stored Seen/Ignored entries down to just
// the fields they actually use (they only ever render as plain text/basic
// cards, never posters/ratings). Only does real work — and a save — the
// first time; already-trimmed entries have nothing left to strip.
function trimLightweightEntries(){
  const keysToTrim = [];
  for(const key in tags){
    const entry = tags[key];
    if((entry.status === 'seen' || entry.status === 'ignore') &&
       (entry.poster_path !== undefined || entry.vote_average !== undefined ||
        entry.vote_count !== undefined || entry.runtime !== undefined || entry.original_language !== undefined)){
      tags[key] = { id: entry.id, mediaType: entry.mediaType, title: entry.title, year: entry.year, status: entry.status };
      keysToTrim.push(key);
    }
  }
  if(keysToTrim.length) saveKeysToDB(keysToTrim);
}

// tags: { [`${mediaType}-${tmdbId}`]: { id, mediaType, title, year, status: 'seen'|'watchlist'|'ignore'|'notify' }, possibly with poster_path/vote_average/vote_count/runtime/original_language/genre_ids for watchlist/notify }
// Starts empty and is populated asynchronously below — IndexedDB reads
// can't happen synchronously at script load the way localStorage could.
let tags = {};

async function initTags(){
  const loaded = await loadAllTagsFromDB();
  if(loaded){
    tags = { ...loaded, ...tags }; // preserve anything tagged in the brief window before this resolved
  } else {
    await migrateFromLocalStorageIfNeeded();
  }
  trimLightweightEntries();
  // Refresh whatever's already on screen now that real data has arrived
  renderDrawer();
  if(mode === 'watchlist') renderWatchlist();
}
initTags();

function keyFor(item){
  return `${item.mediaType || 'movie'}-${item.id}`;
}

let mode = 'trending';
let contentType = 'movie';
let nextPage = 1;
let totalPages = 1;
let renderedIds = new Set();

let genreCache = { movie: [], tv: [] };

let stopRequested = false;

const minVotesInput = document.getElementById('minVotes');

const maxRatingInput = document.getElementById('maxRating');
const maxVotesInput = document.getElementById('maxVotes');

const yearMaxInput = document.getElementById('yearMax');

// Empty/invalid box = no limit on that side (null), never 0.
function numOrNull(el, parser){
  const v = parser(el.value);
  return isNaN(v) ? null : v;
}
function ratingRange(){ return { min: numOrNull(minRatingInput, parseFloat), max: numOrNull(maxRatingInput, parseFloat) }; }
function votesRange(){ return { min: numOrNull(minVotesInput, v => parseInt(v, 10)), max: numOrNull(maxVotesInput, v => parseInt(v, 10)) }; }
function yearRange(){ return { min: numOrNull(yearMinInput, v => parseInt(v, 10)), max: numOrNull(yearMaxInput, v => parseInt(v, 10)) }; }
function inRange(v, r){ return (r.min === null || v >= r.min) && (r.max === null || v <= r.max); }
const goBtn = document.getElementById('goBtn');

apiKeyInput.value = localStorage.getItem(KEY_STORAGE) || '';
apiKeyInput.addEventListener('change', () => {
  localStorage.setItem(KEY_STORAGE, apiKeyInput.value.trim());

// Both movie and TV genre lists are needed up front — Lists mixes both
// types with no toggle to switch between them, and the genre badge on a
// card needs whichever type that specific card actually is. Only fires
// once a key is present; tmdbFetch would otherwise stomp the status line
// with "paste your API key" before the user has done anything.
function prefetchGenreCaches(){
  if(!apiKeyInput.value.trim()) return;
  ensureGenreCache('movie');
  ensureGenreCache('tv');
}
prefetchGenreCaches();

// Snapshot of everything that actually requires a fresh TMDb fetch to change.
// Sort order is deliberately excluded — sorting is handled client-side and
// never needs a re-fetch, so Go shouldn't wipe the loaded list for it.
function currentFetchParams(){
  return JSON.stringify({
    mode,

    q: searchInput.value.trim(),
    genre: genreSelect.value,

    showShortsBrowse: document.getElementById('browseShowShorts').checked,
    showRegularBrowse: document.getElementById('browseShowRegular').checked
  });
}

goBtn.addEventListener('click', () => {
  if(loadedMovies.length > 0 && lastFetchParams === currentFetchParams()){
    // Nothing that requires new data has changed — just re-apply current sort.
    reRenderLoaded();
  } else {
    resetAndFetch();
  }
});

function copyTitleToClipboard(title, year, btn){
  const text = year && year !== '—' ? `${title} ${year}` : title;
  navigator.clipboard.writeText(text).then(() => {
    if(!btn) return;
    const original = btn.textContent;
    btn.textContent = 'COPIED';
    setTimeout(() => { btn.textContent = original; }, 1200);
  }).catch(() => {
    alert('Could not copy to clipboard. Your browser may be blocking clipboard access on this page.');
  });
}
